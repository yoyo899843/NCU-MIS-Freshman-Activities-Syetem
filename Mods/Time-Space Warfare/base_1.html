<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模板 1 陣營對峙 - 時空戰爭</title>
<!--
  模板 1：陣營對峙（Faction）
  依 ui-ux-pro-max 重建：陣營色提亮到 4.5:1 以上，領先/落後除了顏色再加文字標籤
  （color-not-only：不能只靠顏色傳達訊息），比數用 tabular-nums 避免跳位。
  優點：陣營感最強，同一套 CSS 只換一個 class。
  代價：兩套配色都要測，文宣沒有單一主色。
-->
<style>
  :root {
    --bg:#0a0e13; --card:#131b24; --line:#28343f; --fg:#dde8f2; --dim:#96aabb;
    --danger:#ff9aa2; --pad:18px 16px 28px; --r-sm:3px;
    --input-bg:#070b0f; --input-bd:1px solid #28343f; --placeholder:#6d8091;
    --font-body: system-ui, "PingFang TC", "Noto Sans TC", sans-serif;
    --font-num: ui-monospace, "SF Mono", Menlo, monospace;
  }
  /* 陣營配色：整個區塊換 class 就換色，不必維護兩份 CSS */
  .repair  { --f:#3ddbd9;  --on-f:#03211f;  --ring:#3ddbd9; }
  .destroy { --f:#ff7b8a; --on-f:#2c0410; --ring:#ff7b8a; }
  .banner { border:1px solid var(--line); border-left:4px solid var(--f);
            background:var(--card); padding:16px; margin-bottom:14px; }
  .side { display:flex; align-items:center; gap:7px; font-size:14px;
          letter-spacing:.16em; color:var(--f); }
  h1 { margin:7px 0 4px; font-size:23px; font-weight:800; letter-spacing:.02em; }
  .who { margin:0; font-size:15px; color:var(--dim); }
  .who b { color:var(--fg); }
  .vs { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; margin-bottom:14px; }
  .vs .bar { height:10px; background:var(--line); position:relative; overflow:hidden; }
  .vs .bar i { position:absolute; top:0; bottom:0; display:block; }
  .vs .r i { left:0; width:62%; background:#3ddbd9; }
  .vs .d i { right:0; width:38%; background:#ff7b8a; }
  .vs .mid { font-family:var(--font-num); font-size:14px; color:var(--dim); padding:0 4px;
             font-variant-numeric:tabular-nums; }
  .card { border:1px solid var(--line); background:var(--card); padding:15px; margin-bottom:14px; }
  h2 { margin:0 0 13px; font-size:14px; letter-spacing:.14em; color:var(--dim); font-weight:700;
       border-bottom:1px solid var(--line); padding-bottom:9px; }
  .nav { display:grid; gap:9px; }
  .nav a { display:flex; align-items:center; gap:11px; padding:13px 14px;
           background:#0d141b; border:1px solid var(--line); border-left:3px solid var(--f);
           color:var(--fg); text-decoration:none; }
  .nav a:hover, .nav a:active { background:#18222c; }
  .nav .ic { color:var(--f); }
  .nav .t { font-size:16px; font-weight:700; }
  .nav .d { font-size:13px; color:var(--dim); }
  .nav .chev { margin-left:auto; color:var(--dim); }
  input.code { font-family:var(--font-num); font-size:20px; letter-spacing:.28em; text-align:center; }
  button { display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
           padding:13px; border:none; background:var(--f); color:var(--on-f);
           font-family:inherit; font-size:16px; font-weight:800; letter-spacing:.08em; }
  button:hover { filter:brightness(.93); }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); font-weight:500; }
  button.ghost:hover { background:#18222c; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th,td { text-align:left; padding:10px 4px; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:0; }
  th { color:var(--dim); font-size:13px; font-weight:400; }
  th.rt, td.n { text-align:right; font-family:var(--font-num); }
  td.n.r { color:#3ddbd9; } td.n.d { color:#ff7b8a; }
  .tag { display:inline-block; font-size:12px; margin-left:7px; padding:1px 8px;
         border:1px solid #3ddbd9; color:#3ddbd9; border-radius:999px; }
  .tag.dn { border-color:#ff7b8a; color:#ff7b8a; }
  .foot { text-align:center; font-size:13px; color:var(--dim); letter-spacing:.12em; margin-top:20px; }
  .split-note { font-size:14px; color:var(--dim); text-align:center; margin:26px 0 12px; }

  /* ====== 共用基礎層（六個模板一致，只有色票與外觀不同） ======
     對應 ui-ux-pro-max：§1 無障礙 §2 觸控 §5 版面 §6 字體色彩 §7 動效 */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0 auto; padding: var(--pad);
    max-width: 480px; min-height: 100dvh;          /* viewport-units：不用 100vh */
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;                                /* readable-font-size：手機最小 16px */
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  /* number-tabular：數據等寬，不會因為數字變動而跳位 */
  .num, td.n, .clock, .code { font-variant-numeric: tabular-nums; }

  /* touch-target-size：可點擊元素最小 44px；touch-spacing：間距 >= 8px */
  button, input, .nav a, .tile, .btn { min-height: 44px; }
  button, .nav a, .tile, .btn { cursor: pointer; touch-action: manipulation; }

  /* focus-states：3px 可見焦點環，絕不移除 outline */
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--ring); outline-offset: 2px;
  }

  /* state-clarity + press-feedback：按壓有回饋，且不造成版面位移 */
  button, .nav a, .tile {
    transition: background-color .18s ease-out, border-color .18s ease-out, transform .12s ease-out;
  }
  button:active, .nav a:active, .tile:active { transform: scale(.985); }
  button[disabled] { opacity: .45; cursor: not-allowed; }

  /* icon-style-consistent：單一圖示語言，stroke 1.75，尺寸 token 化 */
  .ic { width: 24px; height: 24px; flex: none; stroke: currentColor; fill: none;
        stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ic-sm { width: 18px; height: 18px; }

  /* reduced-motion：尊重系統設定 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important; scroll-behavior: auto !important;
    }
  }

  /* input-labels：標籤永遠可見，不用 placeholder 當標籤 */
  label { display: block; font-size: 14px; color: var(--dim); margin-bottom: 6px; }
  input {
    display: block; width: 100%; padding: 11px 13px;
    font-family: inherit; font-size: 16px;          /* <16px 會觸發 iOS 自動放大 */
    color: var(--fg); background: var(--input-bg);
    border: var(--input-bd); border-radius: var(--r-sm);
  }
  input::placeholder { color: var(--placeholder); }

  /* error-placement + color-not-only：錯誤訊息貼著欄位，且有圖示不只靠顏色 */
  .error { display: flex; gap: 7px; align-items: flex-start;
           color: var(--danger); font-size: 14px; margin: 10px 0 0; }
  .error .ic-sm { margin-top: 1px; }
</style>
</head>
<body>
<div class="repair">
  <header class="banner">
    <p class="side"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19 6.5v5.2c0 4.4-2.9 7.4-7 8.8-4.1-1.4-7-4.4-7-8.8V6.5l7-3Z"/></svg> 時空修復者</p>
    <h1>時空戰爭</h1>
    <p class="who">隊伍 <b>第 07 小隊</b>　代號 K3F9</p>
  </header>

  <div class="vs">
    <div class="bar r"><i></i></div>
    <div class="mid">62 : 38</div>
    <div class="bar d"><i></i></div>
  </div>

  <section class="card">
    <h2>行動</h2>
    <nav class="nav">
    <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4Z"/><path d="M9 4v13M15 7v13"/></svg><span><span class="t">大地圖</span><br><span class="d">9 個交摺點</span></span><svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M7 12h10"/></svg><span><span class="t">掃碼挑戰</span><br><span class="d">知識問答</span></span><svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"/></svg><span><span class="t">PK 對戰</span><br><span class="d">可發起</span></span><svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    </nav>
  </section>

  <section class="card">
    <h2>加入 PK 房間</h2>
    <label for="room1">六碼房號</label>
    <input id="room1" class="code" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000">
    <p class="error"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/></svg><span>房號不存在或對戰已結束，跟對方確認後再輸入一次。</span></p>
    <div style="height:12px"></div>
    <button type="button"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"/></svg> 加入對戰</button>
  </section>

  <section class="card">
    <h2>交摺點戰況</h2>
    <table>
      <thead><tr><th>交摺點</th><th class="rt">修復</th><th class="rt">破壞</th></tr></thead>
      <tbody>
      <tr><td>資訊圖書館<span class="tag">領先</span></td><td class="n r">128</td><td class="n d">64</td></tr>
      <tr><td>管理學院大樓<span class="tag dn">落後</span></td><td class="n r">72</td><td class="n d">96</td></tr>
      <tr><td>大本營</td><td class="n r">40</td><td class="n d">40</td></tr>
      </tbody>
    </table>
  </section>

  <section class="card"><button type="button" class="ghost"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5v-13A1.5 1.5 0 0 1 5.5 4H9"/><path d="M15 8l4 4-4 4M19 12H9"/></svg> 登出</button></section>
</div>

<p class="split-note">— 以下是同一套 CSS 換成破壞者陣營 —</p>

<div class="destroy">
  <header class="banner">
    <p class="side"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5.5 14H11l-1 7 7.5-11H12l1-7Z"/></svg> 時空破壞者</p>
    <h1>時空戰爭</h1>
    <p class="who">隊伍 <b>第 12 小隊</b>　代號 W8T2</p>
  </header>

  <section class="card">
    <h2>加入 PK 房間</h2>
    <label for="room2">六碼房號</label>
    <input id="room2" class="code" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000">
    <div style="height:12px"></div>
    <button type="button"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"/></svg> 加入對戰</button>
  </section>
</div>

<p class="foot">TIME-SPACE WARFARE · 模板 1 陣營對峙</p>
</body>
</html>
