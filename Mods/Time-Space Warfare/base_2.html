<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模板 2 作戰儀表 - 時空戰爭</title>
<!--
  模板 2：作戰儀表（HUD）
  依 ui-ux-pro-max 重建：琥珀提亮到 4.5:1、比數用 tabular-nums、修復/破壞除了顏色
  再加盾牌與閃電圖示（color-not-only）。
  優點：同一套視覺放大就能直接當大會集合投影 Dashboard，手機跟大螢幕不用做兩套。
  代價：陣營色統一成琥珀，敵我靠圖示與標籤區分。
-->
<style>
  :root {
    --bg:#0c1116; --card:#151d25; --line:#2b3742; --fg:#dae5ee; --dim:#9aadbe;
    --amber:#fcc040; --on-amber:#1a1000; --ring:#fcc040; --ok:#5fd39a; --bad:#ff8593; --danger:#ff9aa2;
    --pad:16px; --r-sm:2px;
    --input-bg:#080d11; --input-bd:1px solid #2b3742; --placeholder:#657988;
    --font-body: system-ui, "PingFang TC", "Noto Sans TC", sans-serif;
    --font-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  body { background-image:
      linear-gradient(rgba(252,192,64,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(252,192,64,.05) 1px, transparent 1px);
    background-size:32px 32px; }
  .hud-top { display:flex; justify-content:space-between; align-items:center;
             font-family:var(--font-num); font-size:13px; letter-spacing:.14em; color:var(--dim);
             border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:14px; }
  .hud-top .live { display:inline-flex; align-items:center; gap:6px; color:var(--ok); }
  h1 { margin:0 0 4px; font-size:21px; font-weight:800; letter-spacing:.14em; color:var(--amber); }
  .sub { margin:0 0 16px; font-family:var(--font-num); font-size:13px; color:var(--dim); letter-spacing:.1em; }
  .score { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; text-align:center;
           border:1px solid var(--line); background:var(--card); padding:14px 12px; margin-bottom:14px; }
  .score .lab { display:flex; align-items:center; justify-content:center; gap:6px;
                font-size:13px; letter-spacing:.12em; color:var(--dim); }
  .score .num { font-family:var(--font-num); font-size:36px; font-weight:700; line-height:1.15;
                font-variant-numeric:tabular-nums; }
  .score .r .num { color:var(--ok); } .score .d .num { color:var(--bad); }
  .score .vs { font-family:var(--font-num); font-size:14px; color:var(--dim); padding:0 10px; }
  .card { position:relative; border:1px solid var(--line); background:var(--card);
          padding:15px; margin-bottom:14px; }
  .card::before, .card::after { content:""; position:absolute; width:10px; height:10px; border:solid var(--amber); }
  .card::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .card::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }
  h2 { margin:0 0 13px; font-family:var(--font-num); font-size:13px; letter-spacing:.16em;
       color:var(--amber); font-weight:700; }
  .nav { display:grid; gap:8px; }
  .nav a { display:flex; align-items:center; gap:11px; padding:13px 14px;
           background:#0f161c; border:1px solid var(--line); color:var(--fg); text-decoration:none; }
  .nav a:hover, .nav a:active { border-color:var(--amber); background:#1a242e; }
  .nav .ic { color:var(--amber); }
  .nav .t { font-size:16px; font-weight:700; }
  .nav .d { font-size:13px; color:var(--dim); }
  .nav .k { margin-left:auto; font-family:var(--font-num); font-size:12px; color:var(--dim); letter-spacing:.1em; }
  input.code { font-family:var(--font-num); font-size:21px; letter-spacing:.3em;
               text-align:center; color:var(--amber); }
  button { display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
           padding:13px; border:1px solid var(--amber); background:var(--amber); color:var(--on-amber);
           font-family:inherit; font-size:16px; font-weight:800; letter-spacing:.1em; }
  button:hover { background:#e8ab24; }
  button.ghost { background:transparent; color:var(--dim); border-color:var(--line); font-weight:500; }
  button.ghost:hover { background:#1a242e; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th,td { text-align:left; padding:10px 4px; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:0; }
  th { font-family:var(--font-num); color:var(--dim); font-size:12px; font-weight:400; letter-spacing:.12em; }
  th.rt, td.n { text-align:right; font-family:var(--font-num); }
  td.n.r { color:var(--ok); } td.n.d { color:var(--bad); }
  .tag { display:inline-block; font-size:12px; margin-left:7px; padding:1px 8px;
         border:1px solid var(--ok); color:var(--ok); }
  .tag.dn { border-color:var(--bad); color:var(--bad); }
  .foot { text-align:center; font-family:var(--font-num); font-size:12px; color:var(--dim);
          letter-spacing:.16em; margin-top:20px; }

  /* ====== 共用基礎層（六個模板一致，只有色票與外觀不同） ======
     對應 ui-ux-pro-max：§1 無障礙 §2 觸控 §5 版面 §6 字體色彩 §7 動效 */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0 auto; padding: var(--pad);
    max-width: 480px; min-height: 100dvh;          /* viewport-units：不用 100vh */
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;                                /* readable-font-size：手機最小 16px */
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  /* number-tabular：數據等寬，不會因為數字變動而跳位 */
  .num, td.n, .clock, .code { font-variant-numeric: tabular-nums; }

  /* touch-target-size：可點擊元素最小 44px；touch-spacing：間距 >= 8px */
  button, input, .nav a, .tile, .btn { min-height: 44px; }
  button, .nav a, .tile, .btn { cursor: pointer; touch-action: manipulation; }

  /* focus-states：3px 可見焦點環，絕不移除 outline */
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--ring); outline-offset: 2px;
  }

  /* state-clarity + press-feedback：按壓有回饋，且不造成版面位移 */
  button, .nav a, .tile {
    transition: background-color .18s ease-out, border-color .18s ease-out, transform .12s ease-out;
  }
  button:active, .nav a:active, .tile:active { transform: scale(.985); }
  button[disabled] { opacity: .45; cursor: not-allowed; }

  /* icon-style-consistent：單一圖示語言，stroke 1.75，尺寸 token 化 */
  .ic { width: 24px; height: 24px; flex: none; stroke: currentColor; fill: none;
        stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ic-sm { width: 18px; height: 18px; }

  /* reduced-motion：尊重系統設定 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important; scroll-behavior: auto !important;
    }
  }

  /* input-labels：標籤永遠可見，不用 placeholder 當標籤 */
  label { display: block; font-size: 14px; color: var(--dim); margin-bottom: 6px; }
  input {
    display: block; width: 100%; padding: 11px 13px;
    font-family: inherit; font-size: 16px;          /* <16px 會觸發 iOS 自動放大 */
    color: var(--fg); background: var(--input-bg);
    border: var(--input-bd); border-radius: var(--r-sm);
  }
  input::placeholder { color: var(--placeholder); }

  /* error-placement + color-not-only：錯誤訊息貼著欄位，且有圖示不只靠顏色 */
  .error { display: flex; gap: 7px; align-items: flex-start;
           color: var(--danger); font-size: 14px; margin: 10px 0 0; }
  .error .ic-sm { margin-top: 1px; }
</style>
</head>
<body>
<div class="hud-top">
  <span>NCUMIS // TSW</span>
  <span class="live"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M5.5 5.5a9 9 0 0 0 0 13M18.5 5.5a9 9 0 0 1 0 13"/></svg> 進行中　<span class="clock">13:42</span></span>
</div>

<h1>時空戰爭</h1>
<p class="sub">UNIT 07　/　時空修復者　/　CODE K3F9</p>

<div class="score">
  <div class="r"><div class="lab"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19 6.5v5.2c0 4.4-2.9 7.4-7 8.8-4.1-1.4-7-4.4-7-8.8V6.5l7-3Z"/></svg> 修復</div><div class="num">1284</div></div>
  <div class="vs">VS</div>
  <div class="d"><div class="lab"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5.5 14H11l-1 7 7.5-11H12l1-7Z"/></svg> 破壞</div><div class="num">976</div></div>
</div>

<section class="card">
  <h2>// 作戰選項</h2>
  <nav class="nav">
    <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4Z"/><path d="M9 4v13M15 7v13"/></svg><span><span class="t">大地圖</span><br><span class="d">9 個交摺點</span></span><span class="k">9 NODES</span></a>
    <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M7 12h10"/></svg><span><span class="t">掃碼挑戰</span><br><span class="d">知識問答</span></span><span class="k">SCAN</span></a>
    <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"/></svg><span><span class="t">PK 對戰</span><br><span class="d">可發起</span></span><span class="k">READY</span></a>
  </nav>
</section>

<section class="card">
  <h2>// 加入 PK 房間</h2>
  <label for="room">六碼房號</label>
  <input id="room" class="code" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000">
  <p class="error"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/></svg><span>房號不存在或對戰已結束，跟對方確認後再輸入一次。</span></p>
  <div style="height:12px"></div>
  <button type="button"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"/></svg> 加入對戰</button>
</section>

<section class="card">
  <h2>// 交摺點戰況</h2>
  <table>
    <thead><tr><th>交摺點</th><th class="rt">修復</th><th class="rt">破壞</th></tr></thead>
    <tbody>
      <tr><td>資訊圖書館<span class="tag">領先</span></td><td class="n r">128</td><td class="n d">64</td></tr>
      <tr><td>管理學院大樓<span class="tag dn">落後</span></td><td class="n r">72</td><td class="n d">96</td></tr>
      <tr><td>大本營</td><td class="n r">40</td><td class="n d">40</td></tr>
    </tbody>
  </table>
</section>

<section class="card"><button type="button" class="ghost"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5v-13A1.5 1.5 0 0 1 5.5 4H9"/><path d="M15 8l4 4-4 4M19 12H9"/></svg> 登出</button></section>

<p class="foot">TIME-SPACE WARFARE · 模板 2 作戰儀表</p>
</body>
</html>
