server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # 這個站是把整個 Mods 資料夾原封不動掛上來的（改檔案存檔就能看到，不用重啟），
  # 代價是資料夾裡的非網頁檔案也會被一起服務出去——compose.yml 就這樣變成
  # http://<主機>:9004/compose.yml 直接讀得到。站台掛在共用網路上、之後還要
  # 走 Cloudflare Tunnel 對外，沒必要把部署設定送出去。
  location ~ \.(ya?ml|conf|env|sh|log)$ {
    return 404;
  }
  # 點檔（.git、.DS_Store 之類）一併擋掉
  location ~ /\. {
    return 404;
  }
}
