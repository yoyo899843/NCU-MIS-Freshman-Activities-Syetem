<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模板 2 皇家典藏 - 資管皇家學院數位探查儀</title>
<!--
  模板 2：皇家典藏（Academy）
  概念：走「學院檔案室」路線——米色紙感、暗紅與金、襯線標題。
  優點：大太陽底下最好讀（淺底深字），最貼「皇家學院」四個字，最不容易看膩。
  缺點：科技感最低，「數位探查儀」的機械味要靠文案補。
-->
<style>
  :root {
    --paper: #f2ece0;
    --card: #fffdf7;
    --ink: #2b2318;
    --dim: #7a6a55;
    --rule: #d9ccb4;
    --wine: #7b2d26;
    --gold: #a8802a;
    --red: #a3271f;
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
    --sans: system-ui, "PingFang TC", "Noto Sans TC", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px 16px 28px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px; line-height: 1.75;
    max-width: 480px; margin-inline: auto;
    min-height: 100vh;
  }

  .crest { text-align: center; margin-bottom: 18px; }
  .crest .mark {
    display: inline-block; width: 46px; height: 46px; line-height: 44px;
    border: 2px solid var(--wine); border-radius: 50%;
    color: var(--wine); font-family: var(--serif); font-size: 20px; font-weight: 700;
  }
  h1 {
    font-family: var(--serif);
    margin: 10px 0 2px; font-size: 21px; font-weight: 700;
    color: var(--wine); letter-spacing: .06em;
  }
  .crest .sub {
    font-size: 11px; letter-spacing: .3em; color: var(--gold);
    text-transform: uppercase; margin: 0;
  }
  /* 雙線裝飾 */
  .rule {
    border: 0; border-top: 3px double var(--rule);
    margin: 14px 0 18px;
  }

  .who {
    text-align: center; font-size: 13px; color: var(--dim); margin: 0 0 16px;
  }
  .who b { color: var(--ink); font-family: var(--serif); font-size: 15px; }

  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 16px; margin-bottom: 14px;
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
  }
  .card h2 {
    font-family: var(--serif);
    margin: 0 0 14px; font-size: 15px; font-weight: 700; color: var(--wine);
    padding-bottom: 8px; border-bottom: 1px solid var(--rule);
  }
  .card h2 small {
    float: right; font-family: var(--sans); font-weight: 400;
    font-size: 11px; color: var(--dim); letter-spacing: .1em;
  }

  .nav { list-style: none; margin: 0; padding: 0; }
  .nav li { border-bottom: 1px dotted var(--rule); }
  .nav li:last-child { border-bottom: 0; }
  .nav a {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 2px; color: var(--ink); text-decoration: none; font-size: 15px;
  }
  .nav a .no {
    font-family: var(--serif); color: var(--gold); font-size: 13px;
    min-width: 26px;
  }
  .nav a .arw { color: var(--rule); }
  .nav a:active { color: var(--wine); }

  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; letter-spacing: .08em; }
  input {
    display: block; width: 100%; padding: 11px 12px;
    background: #fffefb; border: 1px solid var(--rule); border-radius: 2px;
    color: var(--ink); font-family: var(--sans); font-size: 16px;
    margin-bottom: 14px;
  }
  input:focus { outline: none; border-color: var(--wine); box-shadow: 0 0 0 2px rgba(123,45,38,.12); }
  input::placeholder { color: #b3a58c; }

  button {
    display: block; width: 100%; padding: 12px;
    background: var(--wine); color: #fdf8ee;
    border: none; border-radius: 2px;
    font-family: var(--serif); font-size: 15px; font-weight: 700; letter-spacing: .18em;
    cursor: pointer;
  }
  button:active { background: #63231d; }
  button.ghost {
    background: transparent; color: var(--dim);
    border: 1px solid var(--rule); font-family: var(--sans);
    font-weight: 400; letter-spacing: .1em;
  }

  .error { color: var(--red); font-size: 13px; margin: 10px 0 0; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 4px; border-bottom: 1px dotted var(--rule); }
  th { color: var(--dim); font-size: 11px; font-weight: 400; letter-spacing: .12em; }
  td.n { font-family: var(--serif); color: var(--gold); text-align: right; }

  .foot {
    text-align: center; font-size: 11px; color: var(--dim);
    letter-spacing: .16em; margin-top: 22px;
  }
</style>
</head>
<body>

<div class="crest">
  <span class="mark">院</span>
  <h1>資管皇家學院</h1>
  <p class="sub">Digital Inquiry Device</p>
</div>
<hr class="rule">

<p class="who">受理學派 · <b>青鸞學派</b></p>

<div class="card">
  <h2>探查事項 <small>共 6 項</small></h2>
  <ul class="nav">
    <li><a href="#"><span><span class="no">Ⅰ</span> 探索導覽</span><span class="arw">›</span></a></li>
    <li><a href="#"><span><span class="no">Ⅱ</span> 線索掃描</span><span class="arw">›</span></a></li>
    <li><a href="#"><span><span class="no">Ⅲ</span> 線索庫</span><span class="arw">›</span></a></li>
    <li><a href="#"><span><span class="no">Ⅳ</span> 權限碼兌換</span><span class="arw">›</span></a></li>
    <li><a href="#"><span><span class="no">Ⅴ</span> 數位偵探</span><span class="arw">›</span></a></li>
    <li><a href="#"><span><span class="no">Ⅵ</span> 最終決策</span><span class="arw">›</span></a></li>
  </ul>
</div>

<div class="card">
  <h2>權限碼兌換</h2>
  <label>權限碼</label>
  <input placeholder="輸入 6 碼權限碼">
  <button>呈　交</button>
  <p class="error">這組權限碼你們已經兌換過了</p>
</div>

<div class="card">
  <h2>線索庫 <small>3 則</small></h2>
  <table>
    <tr><th>編號</th><th>名稱</th><th style="text-align:right">取得</th></tr>
    <tr><td>C-01</td><td>殘缺的門禁紀錄</td><td class="n">掃描</td></tr>
    <tr><td>C-04</td><td>被塗改的課表</td><td class="n">權限碼</td></tr>
    <tr><td>C-07</td><td>伺服器室監視畫面</td><td class="n">關主</td></tr>
  </table>
</div>

<div class="card">
  <button class="ghost">登出</button>
</div>

<p class="foot">RPG SYSTEM · 模板 2 皇家典藏</p>

</body>
</html>
