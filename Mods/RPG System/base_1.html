<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模板 1 探查儀終端 - 資管皇家學院數位探查儀</title>
<!--
  模板 1：探查儀終端（Terminal）
  依 ui-ux-pro-max 重建：等寬字機械感保留，但所有文字對比 >= 4.5:1、內文 16px、
  觸控目標 >= 44px、3px 焦點環、圖示改為 inline SVG（技能禁止用 emoji/字元當結構圖示）。
  優點：沉浸感最強，最貼「數位探查儀」。
  代價：深色底在正午陽光下仍最吃力（對比已拉到合規，但螢幕反光是物理限制）。
-->
<style>
  :root {
    --bg:#070b10; --card:#0e151d; --line:#26333f; --fg:#dbe7f2; --dim:#93a8bb;
    --accent:#4ade80; --on-accent:#052e16; --ring:#4ade80; --danger:#ff9aa2; --amber:#fbbf24;
    --pad:16px; --r-sm:2px;
    --input-bg:#050a0e; --input-bd:1px solid #26333f; --placeholder:#64798c;
    --font-body: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans TC", monospace;
  }
  .head { border:1px solid var(--line); border-top:3px solid var(--accent);
          background:var(--card); padding:15px; margin-bottom:14px; }
  .head .tag { font-size:12px; letter-spacing:.2em; color:var(--dim); }
  h1 { margin:7px 0 5px; font-size:20px; font-weight:700; color:var(--accent); letter-spacing:.03em; }
  .who { margin:0; font-size:15px; color:var(--dim); }
  .who b { color:var(--amber); }
  .status { display:inline-flex; align-items:center; gap:6px; margin-top:11px;
            padding:5px 10px; border:1px solid var(--accent); color:var(--accent); font-size:13px; }
  .card { border:1px solid var(--line); background:var(--card); padding:15px; margin-bottom:14px; }
  h2 { margin:0 0 13px; font-size:14px; letter-spacing:.14em; color:var(--dim); font-weight:700;
       border-bottom:1px solid var(--line); padding-bottom:9px; }
  .nav { display:grid; gap:9px; }
  .nav a { display:flex; align-items:center; gap:11px; padding:12px 13px;
           border:1px solid var(--line); border-left:3px solid var(--accent);
           background:#0b1219; color:var(--fg); text-decoration:none; }
  .nav a:active, .nav a:hover { background:#141f29; }
  .nav .t { font-size:16px; font-weight:700; }
  .nav .d { font-size:13px; color:var(--dim); }
  .nav .ic { color:var(--accent); }
  .nav .chev { margin-left:auto; color:var(--dim); }
  button { display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
           padding:12px; border:none; background:var(--accent); color:var(--on-accent);
           font-family:inherit; font-size:16px; font-weight:700; letter-spacing:.08em; }
  button:hover { background:#38c46b; }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); font-weight:400; }
  button.ghost:hover { background:#141f29; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th,td { text-align:left; padding:10px 5px; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:0; }
  th { color:var(--dim); font-size:13px; font-weight:400; letter-spacing:.1em; }
  .pill { display:inline-flex; align-items:center; gap:5px; font-size:13px; color:var(--amber); }
  .foot { color:var(--dim); font-size:13px; text-align:center; letter-spacing:.1em; }

  /* ====== 共用基礎層（六個模板一致，只有色票與外觀不同） ======
     對應 ui-ux-pro-max：§1 無障礙 §2 觸控 §5 版面 §6 字體色彩 §7 動效 */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0 auto; padding: var(--pad);
    max-width: 480px; min-height: 100dvh;          /* viewport-units：不用 100vh */
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;                                /* readable-font-size：手機最小 16px */
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  /* number-tabular：數據等寬，不會因為數字變動而跳位 */
  .num, td.n, .clock, .code { font-variant-numeric: tabular-nums; }

  /* touch-target-size：可點擊元素最小 44px；touch-spacing：間距 >= 8px */
  button, input, .nav a, .tile, .btn { min-height: 44px; }
  button, .nav a, .tile, .btn { cursor: pointer; touch-action: manipulation; }

  /* focus-states：3px 可見焦點環，絕不移除 outline */
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--ring); outline-offset: 2px;
  }

  /* state-clarity + press-feedback：按壓有回饋，且不造成版面位移 */
  button, .nav a, .tile {
    transition: background-color .18s ease-out, border-color .18s ease-out, transform .12s ease-out;
  }
  button:active, .nav a:active, .tile:active { transform: scale(.985); }
  button[disabled] { opacity: .45; cursor: not-allowed; }

  /* icon-style-consistent：單一圖示語言，stroke 1.75，尺寸 token 化 */
  .ic { width: 24px; height: 24px; flex: none; stroke: currentColor; fill: none;
        stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ic-sm { width: 18px; height: 18px; }

  /* reduced-motion：尊重系統設定 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important; scroll-behavior: auto !important;
    }
  }

  /* input-labels：標籤永遠可見，不用 placeholder 當標籤 */
  label { display: block; font-size: 14px; color: var(--dim); margin-bottom: 6px; }
  input {
    display: block; width: 100%; padding: 11px 13px;
    font-family: inherit; font-size: 16px;          /* <16px 會觸發 iOS 自動放大 */
    color: var(--fg); background: var(--input-bg);
    border: var(--input-bd); border-radius: var(--r-sm);
  }
  input::placeholder { color: var(--placeholder); }

  /* error-placement + color-not-only：錯誤訊息貼著欄位，且有圖示不只靠顏色 */
  .error { display: flex; gap: 7px; align-items: flex-start;
           color: var(--danger); font-size: 14px; margin: 10px 0 0; }
  .error .ic-sm { margin-top: 1px; }
</style>
</head>
<body>
<header class="head">
  <div class="tag">NCUMIS / FIELD UNIT</div>
  <h1>資管皇家學院數位探查儀</h1>
  <p class="who">目前登入學派：<b>青鸞學派</b></p>
  <p class="status"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M5.5 5.5a9 9 0 0 0 0 13M18.5 5.5a9 9 0 0 1 0 13"/></svg> 連線正常</p>
</header>

<section class="card">
  <h2>探查模組</h2>
  <nav class="nav">
    <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4Z"/><path d="M9 4v13M15 7v13"/></svg><span><span class="t">探索導覽</span><br><span class="d">地圖與點位</span></span><svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M7 12h10"/></svg><span><span class="t">線索掃描</span><br><span class="d">掃 QR 取得</span></span><svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v10.5A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5V8Z"/><path d="M3 4.5h18V8H3zM10 12h4"/></svg><span><span class="t">線索庫</span><br><span class="d">已收集 3</span></span><svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="3.5"/><path d="M10 13 19 4M16.5 6.5l2 2M14 9l2 2"/></svg><span><span class="t">權限碼兌換</span><br><span class="d">輸入代碼</span></span><svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M12 7v4M12 11H6v5M12 11h6v5"/></svg><span><span class="t">數位偵探</span><br><span class="d">科技樹</span></span><svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M9 11.5l2 2 4-4"/></svg><span><span class="t">最終決策</span><br><span class="d">長老投票</span></span><svg class="ic ic-sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
  </nav>
</section>

<section class="card">
  <h2>權限碼兌換</h2>
  <label for="code1">權限碼</label>
  <input id="code1" name="code" inputmode="numeric" autocomplete="off" class="code" placeholder="例如 483920">
  <p class="error"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/></svg><span>這組權限碼你們已經兌換過了，換一組再試。</span></p>
  <div style="height:12px"></div>
  <button type="button"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="3.5"/><path d="M10 13 19 4M16.5 6.5l2 2M14 9l2 2"/></svg> 解除封鎖</button>
</section>

<section class="card">
  <h2>線索庫（3）</h2>
  <table>
    <thead><tr><th>編號</th><th>名稱</th><th>取得方式</th></tr></thead>
    <tbody>
      <tr><td class="n">C-01</td><td>殘缺的門禁紀錄</td><td><span class="pill">掃描</span></td></tr>
      <tr><td class="n">C-04</td><td>被塗改的課表</td><td><span class="pill">權限碼</span></td></tr>
      <tr><td class="n">C-07</td><td>伺服器室監視畫面</td><td><span class="pill">關主</span></td></tr>
    </tbody>
  </table>
</section>

<section class="card">
  <button type="button" class="ghost"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5v-13A1.5 1.5 0 0 1 5.5 4H9"/><path d="M15 8l4 4-4 4M19 12H9"/></svg> 登出</button>
</section>

<p class="foot">RPG SYSTEM · 模板 1 探查儀終端</p>
</body>
</html>
