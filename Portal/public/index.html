<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCUMIS Camp 入口網</title>
<meta name="description" content="中央大學資訊管理學系新生營活動系統入口">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

<header class="masthead">
  <p class="eyebrow">NCUMIS Camp</p>
  <h1>活動系統入口</h1>
  <p class="lede">選擇你現在要參加的系統。手機直接點下面的卡片就會進入。</p>
</header>

<div id="announcements"></div>

<h2>遊戲系統</h2>
<div class="systems" id="systems"></div>

<section class="staff" id="staffSection" hidden>
  <h2>工作人員專用</h2>
  <div class="systems" id="staff"></div>
</section>

<footer>
  進不去或畫面怪怪的，先重新整理一次；還是不行就找現場工作人員。
</footer>

</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// 卡片整張就是連結。沒有 url 的（還沒開放的系統）改成 <div>，
// 不是留一個 href="null" 的連結——那個點下去會跳到一個 404。
function cardHtml(s) {
  const accent = s.key ? `style="--sys: var(--sys-${esc(s.key)})"` : '';
  const inner =
    `<div class="subtitle">${esc(s.subtitle || '')}</div>` +
    `<div class="name">${esc(s.name)}</div>` +
    (s.description ? `<p class="desc">${esc(s.description)}</p>` : '');

  if (!s.url) {
    return `<div class="card disabled" ${accent}>
      <span class="badge">尚未開放</span>${inner}
    </div>`;
  }
  return `<a class="card" href="${esc(s.url)}" ${accent}>${inner}</a>`;
}

function render(el, list) {
  el.innerHTML = list.map(cardHtml).join('');
}

// 三份 JSON 各自獨立載入。
//
// 用 allSettled 而不是 all：任何一份檔案壞掉或被刪掉，其他兩份還是要照常顯示。
// 活動當天最不能發生的事，就是有人改公告改到 JSON 少一個逗號，結果整個入口網
// 變成一片空白、三個遊戲全部進不去。
async function load() {
  const [ann, systems, staff] = await Promise.allSettled([
    fetch('announcements.json').then(r => r.json()),
    fetch('systems.json').then(r => r.json()),
    fetch('staff.json').then(r => r.json())
  ]);

  if (ann.status === 'fulfilled' && Array.isArray(ann.value)) {
    document.getElementById('announcements').innerHTML = ann.value.map(a =>
      `<div class="announcement">
         <strong>${esc(a.title)}</strong>
         <p>${esc(a.content)}</p>
       </div>`).join('');
  }

  if (systems.status === 'fulfilled' && Array.isArray(systems.value)) {
    render(document.getElementById('systems'), systems.value);
  } else {
    // 讀不到就要講，不要留一塊空白讓人以為活動還沒開始
    document.getElementById('systems').innerHTML =
      '<div class="card disabled"><div class="name">系統清單載入失敗</div>' +
      '<p class="desc">請重新整理，或找現場工作人員。</p></div>';
  }

  if (staff.status === 'fulfilled' && Array.isArray(staff.value) && staff.value.length) {
    render(document.getElementById('staff'), staff.value);
    document.getElementById('staffSection').hidden = false;
  }
}
load();
</script>
</body>
</html>
