services:
  app:
    build: .
    container_name: portal-app
    restart: unless-stopped
    environment:
      PORT: 8000
    ports:
      - "9000:8000"
    networks:
      - ncumis-camp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  ncumis-camp:
    external: true
