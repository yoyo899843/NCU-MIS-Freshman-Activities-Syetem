<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數位偵探 - 資管皇家學院數位探查儀</title>
<link rel="stylesheet" href="style.css">
<style>
  body { max-width: 640px; }
  .branch-card { margin-bottom: 16px; }
  .branch-title { display: flex; justify-content: space-between; align-items: center; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; color: #fff; }
  .badge-locked { background: #999; }
  .badge-unlocked { background: #2a7d2a; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
  .slot-label { width: 64px; flex-shrink: 0; font-size: 0.85rem; color: #666; }
  .slot-row select { flex: 1; margin: 0; }
  .slot-row.locked select { background: #eaffea; border-color: #2a7d2a; }
  .slot-flash-correct { background: #eaffea !important; }
  .slot-flash-wrong { background: #ffeaea !important; }
  .story-box { white-space: pre-wrap; background: #fafafa; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-top: 8px; }
  .check-bar { position: sticky; bottom: 0; background: #fff; padding: 8px 0; border-top: 1px solid #ddd; }
</style>
</head>
<body>
<h1>數位偵探</h1>
<p class="nav"><a href="index.html">&laquo; 回儀表板</a></p>

<div id="notLoggedIn" class="card" style="display:none">
  <p>請先<a href="login.html">登入</a>學派帳號。</p>
</div>

<div id="content" style="display:none">
  <div class="card">
    <p>把左側下拉選單改成手上的線索、放進你認為對的槽位，放好之後按下方「檢查邏輯」一次驗證。答對的槽位會鎖定變綠，答錯不會扣光——只是會留下嘗試紀錄（影響最終計分），可以換一張線索再試。整條分支的槽位都答對之後，就能閱讀這個分支的劇情。</p>
  </div>

  <div id="branchList"></div>

  <div class="check-bar">
    <button id="checkBtn">檢查邏輯</button>
    <p id="checkResult"></p>
  </div>
</div>

<div id="storyModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; padding:16px; overflow-y:auto">
  <div class="card" style="max-width:600px; margin:40px auto; background:#fff">
    <h3 id="storyTitle"></h3>
    <div id="storyContent" class="story-box"></div>
    <button id="closeStoryBtn">關閉</button>
  </div>
</div>

<script>
const token = localStorage.getItem('schoolToken');
if (!token) {
  document.getElementById('notLoggedIn').style.display = '';
} else {
  document.getElementById('content').style.display = '';
  init();
}

let branches = [];
let vault = [];

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { Authorization: 'Bearer ' + token, ...(options.headers || {}) }
  });
  return res;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function init() {
  await Promise.all([loadVault(), loadTechTree()]);
  render();
}

async function loadVault() {
  const res = await api('/api/clues/vault');
  vault = res.ok ? await res.json() : [];
}

async function loadTechTree() {
  const res = await api('/api/tech-tree');
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    document.getElementById('branchList').innerHTML = `<p class="error">讀取失敗 (${res.status}): ${data.error || ''}</p>`;
    branches = [];
    return;
  }
  branches = await res.json();
}

function clueOptionsHtml(selectedClueId) {
  const owned = vault.map(c =>
    `<option value="${c.id}" ${c.id === selectedClueId ? 'selected' : ''}>${escapeHtml(c.name)}</option>`
  ).join('');
  return `<option value="">（未放置）</option>${owned}`;
}

function render() {
  const listEl = document.getElementById('branchList');
  if (branches.length === 0) {
    listEl.innerHTML = '<p class="card">目前還沒有設定任何科技樹分支。</p>';
    return;
  }

  listEl.innerHTML = branches.map(b => `
    <div class="card branch-card" data-branch-id="${b.id}">
      <div class="branch-title">
        <strong>${escapeHtml(b.name)}</strong>
        <span class="badge ${b.unlocked ? 'badge-unlocked' : 'badge-locked'}">${b.unlocked ? '已解鎖' : `${b.slots.filter(s => s.isLocked).length}/${b.slots.length} 完成`}</span>
      </div>
      ${b.slots.map(s => `
        <div class="slot-row ${s.isLocked ? 'locked' : ''}" data-slot-id="${s.id}">
          <span class="slot-label">槽位 ${s.slotOrder}</span>
          <select ${s.isLocked ? 'disabled' : ''} onchange="placeClue(${s.id}, this.value)">
            ${clueOptionsHtml(s.placedClueId)}
          </select>
        </div>
      `).join('') || '<p style="font-size:0.85rem;color:#666">這個分支還沒有設定任何槽位。</p>'}
      ${b.unlocked ? `<button onclick="readStory(${b.id})">閱讀分支劇情</button>` : ''}
    </div>
  `).join('');
}

window.placeClue = async function (slotId, clueIdValue) {
  const clueId = clueIdValue === '' ? null : parseInt(clueIdValue, 10);
  const res = await api(`/api/tech-tree/slots/${slotId}/place`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ clueId })
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    alert(data.error || `失敗 (${res.status})`);
    await loadTechTree();
    render();
    return;
  }
  // 找出剛剛更新的那一格，直接就地更新資料，不用整份重抓，避免使用者手上其他
  // 還沒放好的下拉選單被重畫打斷。
  for (const b of branches) {
    const slot = b.slots.find(s => s.id === slotId);
    if (slot) {
      slot.placedClueId = clueId;
      break;
    }
  }
};

window.readStory = async function (branchId) {
  const res = await api(`/api/tech-tree/branches/${branchId}/story`);
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || `讀取失敗 (${res.status})`);
    return;
  }
  document.getElementById('storyTitle').textContent = data.name;
  document.getElementById('storyContent').textContent = data.storyContent || '（這個分支還沒有設定劇情內容）';
  document.getElementById('storyModal').style.display = '';
};

document.getElementById('closeStoryBtn').addEventListener('click', () => {
  document.getElementById('storyModal').style.display = 'none';
});

document.getElementById('checkBtn').addEventListener('click', async () => {
  const resultEl = document.getElementById('checkResult');
  resultEl.className = '';
  resultEl.textContent = '檢查中...';

  const res = await api('/api/tech-tree/check', { method: 'POST' });
  const data = await res.json();
  if (!res.ok) {
    resultEl.className = 'error';
    resultEl.textContent = data.error || `失敗 (${res.status})`;
    return;
  }

  if (data.results.length === 0) {
    resultEl.textContent = '目前沒有任何已放置、待檢查的槽位。';
  } else {
    const correctCount = data.results.filter(r => r.correct).length;
    resultEl.textContent = `檢查完成：${correctCount}/${data.results.length} 格正確。` +
      (data.newlyUnlockedBranches.length ? ` 有 ${data.newlyUnlockedBranches.length} 個分支剛剛解鎖！` : '');

    // 短暫閃一下顏色給視覺回饋，正式狀態（鎖定/樣式）等下面 loadTechTree() 重抓完再定案。
    data.results.forEach(r => {
      const row = document.querySelector(`.slot-row[data-slot-id="${r.slotId}"]`);
      row?.classList.add(r.correct ? 'slot-flash-correct' : 'slot-flash-wrong');
    });
  }

  await loadTechTree();
  render();
});
</script>
</body>
</html>
