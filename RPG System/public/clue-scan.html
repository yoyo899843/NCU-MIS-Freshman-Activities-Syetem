<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>線索掃描 - 資管皇家學院數位探查儀</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>線索掃描</h1>
<p class="nav"><a href="index.html">&laquo; 回儀表板</a></p>

<div id="notLoggedIn" class="card" style="display:none">
  <p>請先<a href="login.html">登入</a>學派帳號。</p>
</div>

<div id="content" class="card" style="display:none">
  <p>把 QR Code 對準相機掃描；沒有相機或掃不到的話，也可以在下方手動輸入內容。</p>
  <div id="qr-reader" style="width:100%; max-width:400px; margin:0 auto 8px;"></div>
  <button id="toggleCameraBtn">啟動相機掃描</button>
  <p id="cameraError" class="error"></p>
  <hr>
  <input id="qrToken" placeholder="或手動輸入/貼上 QR Code 內容">
  <button id="scanBtn">送出</button>
  <p id="result"></p>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const token = localStorage.getItem('schoolToken');
if (!token) {
  document.getElementById('notLoggedIn').style.display = '';
} else {
  document.getElementById('content').style.display = '';
}

let html5QrCode = null;
let cameraRunning = false;

document.getElementById('toggleCameraBtn')?.addEventListener('click', () => {
  cameraRunning ? stopCamera() : startCamera();
});

// html5-qrcode 不是每種失敗都會丟標準 Error 物件——例如非安全連線（見下面
// isSecureContext 檢查）的情況，它內部是直接 reject 一個純文字字串，根本沒有
// .message 這個屬性，直接讀 err.message 只會拿到 undefined，訊息就變成一頭霧水
// 的「無法啟動相機（undefined）」。這裡統一處理各種可能的錯誤形狀。
function describeCameraError(err) {
  if (typeof err === 'string' && err) return err;
  if (err && typeof err.message === 'string' && err.message) return err.message;
  if (err && typeof err.name === 'string' && err.name) return err.name;
  return '未知錯誤';
}

async function startCamera() {
  const errorEl = document.getElementById('cameraError');
  errorEl.textContent = '';

  // 相機（getUserMedia）只有在安全情境（https，或 localhost）下瀏覽器才會允許使用。
  // 用 http://區網IP:port 這種方式在手機上開的話會直接被擋掉——先在這裡主動判斷、
  // 給出清楚的原因，不要等函式庫丟出讓人看不懂的錯誤才發現。
  if (!window.isSecureContext) {
    errorEl.textContent = '無法啟動相機：這個頁面不是安全連線（需要 https 或 localhost），瀏覽器不允許使用相機。可以改用下方手動輸入，或透過 https 網址開啟這個頁面。';
    return;
  }

  try {
    html5QrCode = new Html5Qrcode('qr-reader');
    await html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 250 },
      decodedText => {
        // 掃到就自動關掉相機再送出，避免同一個碼在畫面還對著它時被連續觸發好幾次。
        document.getElementById('qrToken').value = decodedText;
        stopCamera();
        submitScan(decodedText);
      },
      () => {} // 每一幀解碼失敗都會呼叫一次，鏡頭對準過程中本來就會一直發生，不用理會。
    );
    cameraRunning = true;
    document.getElementById('toggleCameraBtn').textContent = '關閉相機';
  } catch (err) {
    cameraRunning = false;
    errorEl.textContent = '無法啟動相機（' + describeCameraError(err) + '），可以改用下方手動輸入。';
  }
}

async function stopCamera() {
  if (html5QrCode && cameraRunning) {
    try {
      await html5QrCode.stop();
      await html5QrCode.clear();
    } catch (err) {
      // 相機可能已經被瀏覽器關掉（例如切到背景），stop() 失敗不影響後續重新啟動。
    }
  }
  cameraRunning = false;
  document.getElementById('toggleCameraBtn').textContent = '啟動相機掃描';
}

document.getElementById('scanBtn')?.addEventListener('click', () => {
  submitScan(document.getElementById('qrToken').value.trim());
});

async function submitScan(qrToken) {
  const resultEl = document.getElementById('result');
  resultEl.className = '';

  if (!qrToken) {
    resultEl.className = 'error';
    resultEl.textContent = '請輸入 QR Code 內容';
    return;
  }

  try {
    const res = await fetch('/api/clues/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ qrToken })
    });
    const data = await res.json();
    if (!res.ok) {
      resultEl.className = 'error';
      resultEl.textContent = `掃描失敗 (${res.status}): ${data.error || ''}`;
      return;
    }
    resultEl.textContent = data.alreadyAcquired
      ? `你已經拿過線索「${data.clue.name}」了，可以到線索庫查看。`
      : `獲得線索「${data.clue.name}」！可以到線索庫查看。`;
    document.getElementById('qrToken').value = '';
  } catch (err) {
    resultEl.className = 'error';
    resultEl.textContent = '連線失敗: ' + err.message;
  }
}
</script>
</body>
</html>
