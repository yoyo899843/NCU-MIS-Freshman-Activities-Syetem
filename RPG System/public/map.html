<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探索導覽 - 資管皇家學院數位探查儀</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { max-width: none; padding: 0; }
  #map { height: 100vh; width: 100%; }
  .top-bar {
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    z-index: 1000;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.9rem;
  }
  .top-bar a { margin-right: 8px; }
</style>
</head>
<body>
<div id="notLoggedIn" class="card" style="display:none; margin: 16px;">
  <p>請先<a href="login.html">登入</a>學派帳號。</p>
</div>

<div id="content" style="display:none">
  <div class="top-bar">
    <a href="index.html">&laquo; 回儀表板</a>
    <strong>探索導覽</strong>
    <span id="progressSummary"></span>
    <span id="locationStatus"></span>
    <span id="loadError" class="error"></span>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="geofence.js"></script>
<script>
const token = localStorage.getItem('schoolToken');
const schoolInfo = JSON.parse(localStorage.getItem('schoolInfo') || 'null');
if (!token || !schoolInfo) {
  document.getElementById('notLoggedIn').style.display = '';
} else {
  document.getElementById('content').style.display = '';
  initMap();
}

// 每 2 秒才動作一次——不是每次 GPS 更新就打一次 API：上傳自己的座標、以及跟
// 伺服器要一次所有學派目前的座標，都是固定週期的 REST 輪詢（見
// src/routes/locations.js），這個系統沒有用 Socket.IO。做法跟 Time-Space
// Warfare 的 public/map.html 完全一樣。
const LOCATION_INTERVAL_MS = 2000;

// 固定色盤，依 schoolId 算雜湊後取色，讓每個學派的定位標記顏色在不同人的
// 瀏覽器上都是同一個顏色（不用伺服器另外指定顏色）。
const SCHOOL_COLORS = ['#c00', '#06c', '#2a8', '#f90', '#909'];
function schoolColor(schoolId) {
  let hash = 0;
  for (const ch of String(schoolId)) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return SCHOOL_COLORS[hash % SCHOOL_COLORS.length];
}

function initMap() {
  // 活動範圍 bounding box，跟 scripts/download-tiles.js 下載圖磚用的是同一個範圍。
  const BOUNDS = L.latLngBounds(
    [25.018806, 121.937006],
    [25.021761, 121.940729]
  );

  const map = L.map('map', {
    minZoom: 15,
    maxZoom: 19,
    maxBounds: BOUNDS.pad(0.2),
    maxBoundsViscosity: 1.0
  });
  map.fitBounds(BOUNDS);

  // 自行 host 的活動範圍 tile 圖磚（scripts/download-tiles.js 下載好放進
  // public/tiles/），不對外連任何 tile server。
  L.tileLayer('/tiles/{z}/{x}/{y}.png', {
    minZoom: 15,
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
  }).addTo(map);

  // 自己的位置：不用等伺服器回應，收到 GPS 更新的當下直接畫在地圖上，
  // 用跟其他學派不同的樣式（藍色方塊感的圓點＋固定 tooltip）分辨。
  let selfMarker = null;
  function updateSelfMarker(lat, lng) {
    if (!selfMarker) {
      selfMarker = L.circleMarker([lat, lng], {
        radius: 8,
        color: '#000',
        weight: 2,
        fillColor: '#06c',
        fillOpacity: 0.9
      }).addTo(map).bindTooltip('你的位置', { permanent: true });
    } else {
      selfMarker.setLatLng([lat, lng]);
    }
  }

  // GPS 圍籬：離開活動範圍會顯示紅色提示條（見 geofence.js），比照 Time-Space
  // Warfare 只掛在地圖頁的做法——這裡是唯一需要判斷「人在不在範圍內」的頁面。
  // 校園範圍內的每次讀值同時拿來畫自己的標記、留著給下面的 2 秒上傳計時器用。
  let latestCoords = null;
  startGeofence((lat, lng) => {
    latestCoords = { lat, lng };
    updateSelfMarker(lat, lng);
  });

  // 地圖直接顯示所有學派的位置，不分敵我——關掉瀏覽器/斷線也不會讓標記消失：
  // 伺服器一直保留每個學派最後一次回報的座標，只是標記會從「連線中」（實心、
  // 顯示「現在」）變成「離線」（半透明、顯示「X 分鐘前」），見下面 live 欄位。
  document.getElementById('locationStatus').textContent = '（定位分享中）';
  const otherMarkers = new Map(); // schoolId -> L.CircleMarker
  const selfSchoolId = schoolInfo.id;

  function statusText(school) {
    if (school.live) return '現在';
    const minutes = Math.floor((Date.now() - school.updatedAt) / 60000);
    return minutes < 1 ? '剛離線' : `${minutes} 分鐘前`;
  }

  setInterval(() => {
    if (!latestCoords) return;
    fetch('/api/locations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(latestCoords)
    }).catch(() => {}); // 單次上傳失敗不用特別處理，反正 2 秒後會再傳一次
  }, LOCATION_INTERVAL_MS);

  setInterval(() => {
    fetch('/api/locations', { headers: { Authorization: 'Bearer ' + token } })
      .then(res => res.json())
      .then(schools => {
        // 這裡回來的名單不會因為斷線而少人，所以不用做「消失名單裡沒有的標記」
        // 那種清理——每個學派只會一直被更新（位置 + 連線狀態），不會被移除。
        schools.forEach(s => {
          if (s.schoolId === selfSchoolId) return; // 自己已經用 selfMarker 畫過了

          const color = schoolColor(s.schoolId);
          const tooltipText = `${s.displayName || '?'}<br>${statusText(s)}`;

          let marker = otherMarkers.get(s.schoolId);
          if (!marker) {
            marker = L.circleMarker([s.lat, s.lng], {
              radius: 8,
              color,
              fillColor: color,
              fillOpacity: s.live ? 0.85 : 0.35
            }).addTo(map).bindTooltip(tooltipText, { permanent: true });
            otherMarkers.set(s.schoolId, marker);
          } else {
            marker.setLatLng([s.lat, s.lng]);
            marker.setStyle({ color, fillColor: color, fillOpacity: s.live ? 0.85 : 0.35 });
            marker.setTooltipContent(tooltipText);
          }
        });
      })
      .catch(() => {});
  }, LOCATION_INTERVAL_MS);

  // 關卡 name/description 之後會開放 admin 編輯（見 admin.js 的 checkpoints CRUD，
  // 目前還是 501 stub），屆時內容就不再是我們自己塞的測試資料、不能再假設它安全，
  // 所以先在這裡跳脫，避免變成儲存型 XSS（惡意內容存進 DB，每個玩家點開這個
  // 關卡的地圖標記時就在瀏覽器裡執行）。
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  // 依解鎖/完成狀態決定關卡標記顏色：灰色未解鎖、藍色已解鎖待挑戰、綠色已完成挑戰。
  function markerColor(cp) {
    if (!cp.unlocked) return '#999';
    if (cp.challengeStatus === 'completed') return '#2a8';
    return '#06c';
  }

  fetch('/api/checkpoints', { headers: { Authorization: 'Bearer ' + token } })
    .then(res => res.json().then(data => ({ ok: res.ok, status: res.status, data })))
    .then(({ ok, status, data }) => {
      if (!ok) {
        document.getElementById('loadError').textContent = `讀取關卡資料失敗 (${status}): ${data.error || ''}`;
        return;
      }

      const unlockedCount = data.filter(cp => cp.unlocked).length;
      const completedCount = data.filter(cp => cp.challengeStatus === 'completed').length;
      document.getElementById('progressSummary').textContent =
        `已解鎖 ${unlockedCount}/${data.length} 關卡，已完成挑戰 ${completedCount}/${data.length}`;

      data.forEach(cp => {
        if (cp.mapLat == null || cp.mapLng == null) return;
        const statusLabel = !cp.unlocked
          ? '尚未解鎖'
          : cp.challengeStatus === 'completed' ? '挑戰完成'
          : cp.challengeStatus === 'in_progress' ? '挑戰中'
          : '已解鎖，尚未挑戰';

        L.circleMarker([cp.mapLat, cp.mapLng], {
          radius: 10,
          color: markerColor(cp),
          fillColor: markerColor(cp),
          fillOpacity: 0.85
        })
          .addTo(map)
          .bindPopup(
            `<strong>${escapeHtml(cp.name)}</strong><br>${escapeHtml(cp.description)}<br>` +
            `狀態：${statusLabel}<br>線索：${cp.clueCollected}/${cp.clueTotal}`
          );
      });
    })
    .catch(err => {
      document.getElementById('loadError').textContent = '連線失敗: ' + err.message;
    });
}
</script>
</body>
</html>
