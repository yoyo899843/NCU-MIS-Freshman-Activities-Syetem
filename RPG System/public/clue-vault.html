<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>線索庫 - 資管皇家學院數位探查儀</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>線索庫</h1>
<p class="nav"><a href="index.html">&laquo; 回儀表板</a> <a href="redeem.html">權限碼兌換</a></p>

<div id="notLoggedIn" class="card" style="display:none">
  <p>請先<a href="login.html">登入</a>學派帳號。</p>
</div>

<div id="content" class="card" style="display:none">
  <p id="empty" style="display:none">還沒有任何線索——去掃描 QR Code 或兌換權限碼看看。</p>
  <div id="list"></div>
  <p id="error" class="error"></p>
</div>

<script src="authFetch.js"></script>
<script>
const token = localStorage.getItem('schoolToken');
if (!token) {
  document.getElementById('notLoggedIn').style.display = '';
} else {
  document.getElementById('content').style.display = '';
  fetch('/api/clues/vault', { headers: { Authorization: 'Bearer ' + token } })
    .then(res => res.json().then(data => ({ ok: res.ok, status: res.status, data })))
    .then(({ ok, status, data }) => {
      if (!ok) {
        document.getElementById('error').textContent = `讀取失敗 (${status}): ${data.error || ''}`;
        return;
      }
      if (data.length === 0) {
        document.getElementById('empty').style.display = '';
        return;
      }
      const listEl = document.getElementById('list');
      const viaLabel = { scan: 'QR 掃描', code: '權限碼兌換' };
      const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
      data.forEach(clue => {
        const item = document.createElement('div');
        item.className = 'card';
        const time = new Date(clue.acquired_at).toLocaleString('zh-TW');
        const location = clue.acquisition_location
          ? `<p style="font-size:0.85rem;color:var(--dim)">獲得地點：${escapeHtml(clue.acquisition_location)}</p>`
          : '';
        item.innerHTML = `
          <strong>${escapeHtml(clue.name)}</strong>
          <p>${escapeHtml(clue.description)}</p>
          ${location}
          <p style="font-size:0.85rem;color:var(--dim)">取得方式：${escapeHtml(viaLabel[clue.acquired_via] || clue.acquired_via)} ／ ${time}</p>
        `;
        listEl.appendChild(item);
      });
    })
    .catch(err => {
      document.getElementById('error').textContent = '連線失敗: ' + err.message;
    });
}
</script>
</body>
</html>
