<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>操作稽核紀錄 - 資管皇家學院數位探查儀</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { max-width: 1120px; }
  .meta { color: var(--dim); font-size: .85rem; }
  .audit-table { width: 100%; border-collapse: collapse; }
  .audit-table th, .audit-table td { padding: 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .audit-table details { min-width: 150px; }
  .audit-table pre { max-width: 330px; max-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-word; background: var(--card-2); padding: 8px; border-radius: 4px; }
</style>
</head>
<body>
<h1>操作稽核紀錄</h1>
<p class="nav"><a href="index.html">&laquo; 回管理後台</a></p>
<div class="card">
  <p class="hint">保留最近 500 筆後台與關主操作；包含操作帳號、時間、目標及異動前後資料。</p>
  <button id="refreshBtn">重新整理</button>
  <p id="status" class="meta">載入中...</p>
  <div style="overflow-x:auto"><table class="audit-table">
    <thead><tr><th>時間</th><th>操作帳號</th><th>動作</th><th>目標</th><th>異動資料</th></tr></thead>
    <tbody id="logsBody"></tbody>
  </table></div>
</div>
<script src="../authFetch.js"></script>
<script>
const token = localStorage.getItem('adminToken');
if (!token) location.href = 'login.html';
const $ = id => document.getElementById(id);
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
const actionLabels = {
  create_gatekeeper: '新增關主', reset_gatekeeper_password: '重設關主密碼', delete_gatekeeper: '刪除關主',
  unlock_checkpoint_for_school: '解鎖關卡', complete_checkpoint_for_school: '完成關卡', grant_clue_to_school: '發放線索',
  create_school: '新增學派', update_school: '更新學派', delete_school: '刪除學派',
  create_checkpoint: '新增關卡', update_checkpoint: '更新關卡', delete_checkpoint: '刪除關卡',
  create_clue: '新增線索', update_clue: '更新線索', delete_clue: '刪除線索', import_clues: '匯入線索',
  create_access_code: '新增權限碼', delete_access_code: '刪除權限碼', import_access_codes: '匯入權限碼',
  create_tech_branch: '新增科技樹分支', update_tech_branch: '更新科技樹分支', delete_tech_branch: '刪除科技樹分支',
  create_tech_slot: '新增科技樹格', update_tech_slot: '更新科技樹格', delete_tech_slot: '刪除科技樹格',
  create_elder: '新增長老', update_elder: '更新長老', delete_elder: '刪除長老',
  start_game: '開始遊戲', end_game: '結束遊戲', open_voting: '開放投票', close_voting: '關閉投票'
};
async function api(path) {
  const res = await fetch('/admin/api' + path, { headers: { Authorization: 'Bearer ' + token } });
  if (res.status === 401) { localStorage.removeItem('adminToken'); location.href = 'login.html'; throw new Error('unauthorized'); }
  return res;
}
function jsonDetails(before, after) {
  return `<details><summary>查看資料</summary><pre>${escapeHtml(JSON.stringify({ before: before || null, after: after || null }, null, 2))}</pre></details>`;
}
async function loadLogs() {
  const res = await api('/audit-logs');
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { $('status').textContent = data.error || `載入失敗（${res.status}）`; return; }
  $('logsBody').innerHTML = data.map(log => `<tr>
    <td class="meta">${new Date(log.created_at).toLocaleString()}</td>
    <td>${escapeHtml(log.operator_name || log.operator_email)}<br><span class="meta">${escapeHtml(log.operator_email)}</span></td>
    <td>${escapeHtml(actionLabels[log.action_type] || log.action_type)}</td>
    <td>${escapeHtml(log.target_type)}<br><span class="meta">${escapeHtml(log.target_id)}</span></td>
    <td>${jsonDetails(log.before_value, log.after_value)}</td>
  </tr>`).join('') || '<tr><td colspan="5">目前沒有操作紀錄</td></tr>';
  $('status').textContent = `共 ${data.length} 筆紀錄`;
}
$('refreshBtn').addEventListener('click', loadLogs);
loadLogs();
</script>
</body>
</html>
