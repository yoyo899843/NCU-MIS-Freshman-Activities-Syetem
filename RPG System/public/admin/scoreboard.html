<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>戰況板 - 資管皇家學院數位探查儀</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { max-width: 720px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
  th { background: #eee; }
  td.score { font-weight: bold; }
  tr:first-child td.score { color: #2a7d2a; }
</style>
</head>
<body>
<h1>戰況板</h1>
<p class="nav"><a href="index.html">&laquo; 回管理後台</a></p>
<p style="font-size:0.85rem;color:#666">計分方式：科技樹每答對一格 +10 分，檢查邏輯答錯一次 -2 分（分數可能是負的）。即時計算，不是累計存好的固定值。</p>

<div class="card">
  <button id="refreshBtn">重新整理</button>
  <table>
    <thead>
      <tr>
        <th>排名</th><th>學派</th><th>分數</th><th>答對槽位</th><th>答錯次數</th><th>線索數</th><th>已解鎖分支</th>
      </tr>
    </thead>
    <tbody id="scoreboardBody"></tbody>
  </table>
</div>

<script>
const token = localStorage.getItem('adminToken');
if (!token) location.href = 'login.html';

async function api(path, options = {}) {
  const res = await fetch('/admin/api' + path, {
    ...options,
    headers: { Authorization: 'Bearer ' + token, ...(options.headers || {}) }
  });
  if (res.status === 401) {
    localStorage.removeItem('adminToken');
    location.href = 'login.html';
    throw new Error('unauthorized');
  }
  return res;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadScoreboard() {
  const res = await api('/scoreboard');
  const rows = await res.json();
  document.getElementById('scoreboardBody').innerHTML = rows.map((r, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${escapeHtml(r.displayName)}</td>
      <td class="score">${r.score}</td>
      <td>${r.correctSlots}</td>
      <td>${r.wrongAttempts}</td>
      <td>${r.cluesCollected}</td>
      <td>${r.branchesUnlocked}</td>
    </tr>
  `).join('') || '<tr><td colspan="7">目前沒有任何學派帳號</td></tr>';
}

document.getElementById('refreshBtn').addEventListener('click', loadScoreboard);
loadScoreboard();
</script>
</body>
</html>
