<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帳號管理 - 資管皇家學院數位探查儀</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { max-width: 760px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; }
  th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  th { background: var(--card-2); }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; color: #fff; }
  .role-admin { background: #2a7d2a; }
  .role-gatekeeper { background: #a85400; }
  .row-actions button { width: auto; display: inline-block; padding: 4px 8px; margin: 0 4px 0 0; }
  .self-tag { font-size: 0.75rem; color: var(--dim); margin-left: 4px; }
  .fixed-note { font-size: 0.8rem; color: var(--dim); }
</style>
</head>
<body>
<h1>帳號管理</h1>
<p class="nav"><a href="index.html">&laquo; 回管理後台</a></p>

<div class="card">
  <p><strong>管理員</strong>：什麼都能做。<strong>這一級是固定的</strong>——只能在伺服器上用
     <code>node scripts/create-admin.js</code> 建立或調整，網頁上不能新增、不能升級、不能刪除。</p>
  <p><strong>關主</strong>：現場工作人員。可以看所有清單跟戰況板、幫隊伍標記關卡解鎖/完成、直接發線索給隊伍；不能改設定、不能管帳號、不能控制遊戲進程。<strong>關主帳號可以在這一頁新增／重設密碼／刪除。</strong></p>
</div>

<div class="card" id="createCard" style="display:none">
  <h3>新增關主帳號</h3>
  <input id="newEmail" placeholder="Email（登入帳號）">
  <input id="newPassword" placeholder="密碼（至少 8 個字元）">
  <input id="newDisplayName" placeholder="顯示名稱（選填，例如「關主小明」）">
  <button id="createBtn">新增關主</button>
  <p id="createResult" class="error"></p>
</div>

<div class="card">
  <h3>帳號清單</h3>
  <table>
    <thead>
      <tr><th>Email</th><th>名稱</th><th>權限</th><th>操作</th></tr>
    </thead>
    <tbody id="adminsBody"></tbody>
  </table>
  <p id="result" class="error"></p>
</div>

<script>
const token = localStorage.getItem('adminToken');
if (!token) location.href = 'login.html';

let me = null;

async function api(path, options = {}) {
  const res = await fetch('/admin/api' + path, {
    ...options,
    headers: { Authorization: 'Bearer ' + token, ...(options.headers || {}) }
  });
  if (res.status === 401) {
    localStorage.removeItem('adminToken');
    location.href = 'login.html';
    throw new Error('unauthorized');
  }
  return res;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const roleLabel = r => r === 'gatekeeper' ? '關主' : '管理員';

async function load() {
  const meRes = await api('/me');
  me = await meRes.json();

  // 關主不會從後台首頁看到這一頁的入口，但就算硬打網址進來，
  // 也只會看到一句話——真正的權限是後端 requireFullAdmin 在擋。
  const isAdmin = me.adminRole === 'admin';
  document.getElementById('createCard').style.display = isAdmin ? '' : 'none';

  const res = await api('/admins');
  if (res.status === 403) {
    document.getElementById('adminsBody').innerHTML =
      '<tr><td colspan="4">你目前是關主，沒有權限管理帳號。</td></tr>';
    return;
  }
  const admins = await res.json();

  document.getElementById('adminsBody').innerHTML = admins.map(a => {
    const isSelf = a.id === me.id;
    const isGatekeeper = a.role === 'gatekeeper';
    return `
    <tr>
      <td>${escapeHtml(a.email)}${isSelf ? '<span class="self-tag">（你自己）</span>' : ''}</td>
      <td>${escapeHtml(a.display_name || '')}</td>
      <td><span class="role-badge role-${a.role}">${roleLabel(a.role)}</span></td>
      <td class="row-actions">
        ${isGatekeeper ? `
          <button onclick="resetPassword(${a.id})">重設密碼</button>
          <button onclick="removeAccount(${a.id})">刪除</button>
        ` : '<span class="fixed-note">固定帳號，只能用 CLI 調整</span>'}
      </td>
    </tr>
  `;
  }).join('') || '<tr><td colspan="4">目前沒有任何管理端帳號</td></tr>';
}

document.getElementById('createBtn').addEventListener('click', async () => {
  const resultEl = document.getElementById('createResult');
  resultEl.textContent = '';

  const res = await api('/admins', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: document.getElementById('newEmail').value.trim(),
      password: document.getElementById('newPassword').value,
      displayName: document.getElementById('newDisplayName').value.trim()
    })
  });
  const data = await res.json();
  if (!res.ok) {
    resultEl.textContent = data.error || `失敗 (${res.status})`;
    return;
  }
  document.getElementById('newEmail').value = '';
  document.getElementById('newPassword').value = '';
  document.getElementById('newDisplayName').value = '';
  await load();
});

window.resetPassword = async function (id) {
  const password = prompt('輸入新密碼（至少 8 個字元）：');
  if (!password) return;

  const resultEl = document.getElementById('result');
  resultEl.textContent = '';
  const res = await api(`/admins/${id}/password`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    resultEl.textContent = data.error || `失敗 (${res.status})`;
    return;
  }
  alert('密碼已重設');
};

window.removeAccount = async function (id) {
  if (!confirm('確定要刪除這個關主帳號嗎？')) return;

  const resultEl = document.getElementById('result');
  resultEl.textContent = '';
  const res = await api(`/admins/${id}`, { method: 'DELETE' });
  if (res.status === 204) {
    await load();
    return;
  }
  const data = await res.json().catch(() => ({}));
  resultEl.textContent = data.error || `失敗 (${res.status})`;
};

load();
</script>
</body>
</html>
