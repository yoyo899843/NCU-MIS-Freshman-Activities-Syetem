# 每個 ${VAR:?...} 的 :? 是「這個變數沒有值就直接失敗」。
#
# 沒有這個保護的話，缺 .env 時 compose 只會印一行 warning 然後把變數代成空字串，
# postgres 因為 POSTGRES_PASSWORD 是空的而拒絕初始化、容器起來就馬上退出，最後
# 畫面上只看得到「dependency failed to start: container xxx-db is unhealthy」——
# 那句話完全沒提到真正的原因是少了一個檔案。實際上就踩過這個坑。
#
# 加了之後 compose 會在建立任何容器「之前」就停下來，並且直接說出少了哪個變數。

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ncumis-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?請先在這個資料夾 cp .env.example .env 並填好內容}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?請先在這個資料夾 cp .env.example .env 並填好內容}
    ports:
      - "9002:80"
    networks:
      - ncumis-camp
      - timewarfare-internal
      - rpg-internal
      - stock-internal
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  pgadmin-data:

networks:
  ncumis-camp:
    external: true
  # 由各系統自己的 compose 建立，這裡只是加入。
  # 再多一個系統時，回來這裡多接一條 external network 即可。
  timewarfare-internal:
    external: true
  rpg-internal:
    external: true
  stock-internal:
    external: true
