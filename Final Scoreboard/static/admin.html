<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>總積分榜管理｜資管新生營</title>
  <style>
    :root{--ink:#18233d;--muted:#64748b;--paper:#f5f7fb;--line:#dde4ef;--navy:#142c54;--sky:#2f80ed;--good:#007c63;--danger:#b42336;--card:#fff}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 0 0,#e3edf9 0,transparent 35rem),var(--paper);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Noto Sans TC",sans-serif}.shell{max-width:1440px;margin:auto;padding:28px clamp(16px,3vw,44px) 52px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.eyebrow{margin:0 0 5px;color:var(--sky);font-weight:800;font-size:.78rem;letter-spacing:.14em}h1{margin:0;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.045em}.intro{margin:6px 0 0;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #18233d0a;overflow:hidden}.toolbar{display:flex;justify-content:space-between;align-items:start;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line)}.toolbar h2{margin:0;font-size:1.05rem}.toolbar p{margin:2px 0 0;color:var(--muted);font-size:.86rem}.actions{display:flex;gap:8px;flex-wrap:wrap}button{appearance:none;border:1px solid #b9c8dd;border-radius:8px;padding:8px 11px;color:var(--navy);background:#fff;cursor:pointer;font:inherit;font-weight:750}button:hover{background:#edf5ff;border-color:var(--sky)}button.primary{background:var(--navy);border-color:var(--navy);color:#fff}button.primary:hover{background:#1c4077}button.danger{color:var(--danger)}button.loading{opacity:.58;pointer-events:none}button:focus-visible,input:focus-visible{outline:3px solid #7ab5ff88;outline-offset:2px}.status{padding:9px 18px;background:#f8fbff;color:var(--muted);border-bottom:1px solid var(--line);font-size:.87rem;min-height:40px}.status.error{background:#fff6f7;color:#a51f31}.table-wrap{overflow:auto}.score-table{width:100%;min-width:930px;border-collapse:collapse}.score-table th,.score-table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.score-table th{background:#f8fafc;color:#526078;font-size:.76rem;letter-spacing:.04em}.score-table th:first-child,.score-table td:first-child{text-align:left}.total{color:var(--navy);font-size:1.05rem;font-weight:900}.api-mark,.manual-mark{display:block;margin-top:2px;font-size:.72rem}.api-mark{color:var(--good)}.manual-mark{color:var(--muted)}input{width:100%;min-width:88px;border:1px solid #cbd7e7;border-radius:7px;padding:7px 8px;background:#fff;color:var(--ink);font:inherit;text-align:right}.name-input{min-width:138px;text-align:left;font-weight:700}.hidden{display:none!important}.login{max-width:440px;margin:10vh auto}.login h2{margin:0 0 4px}.login p{color:var(--muted);margin:0 0 18px}.form{padding:20px;display:grid;gap:14px}.form label{display:grid;gap:5px;font-weight:700}.form input{text-align:left}.form button{justify-self:start}.back{color:var(--muted);text-decoration:none;font-size:.9rem}@media(max-width:760px){.shell{padding-top:20px}header,.toolbar{flex-direction:column;align-items:start}.actions{width:100%}.actions button{flex:1 1 120px}}
  </style>
</head>
<body>
<main class="shell">
  <a class="back" href="index.html">← 公開排行榜</a>
  <header><div><p class="eyebrow">NCU MIS · FINAL SCOREBOARD</p><h1>計分管理</h1><p class="intro">輸入成績與載入遊戲分數</p></div><button id="logoutBtn" class="hidden" type="button">登出</button></header>
  <section id="loginPanel" class="card login"><form class="form" id="loginForm"><div><h2>管理員登入</h2><p>請輸入 .env 設定的帳號與密碼。</p></div><label>帳號<input id="username" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登入</button><div id="loginStatus" role="status"></div></form></section>
  <section id="editor" class="card hidden"><div class="toolbar"><div><h2>五學派結算表</h2><p>變更後按儲存，公開排行榜會立即使用新分數。</p></div><div class="actions"><button type="button" data-source="stock">載入賭大 API</button><button type="button" data-source="rpg">載入 RPG API</button><button type="button" id="clearBtn">清除來源分數</button><button class="primary" type="button" id="saveBtn">儲存分數</button></div></div><div class="status" id="status" role="status"></div><div class="table-wrap"><table class="score-table"><thead><tr><th>學派</th><th>對抗賽分數</th><th>賭大總資產</th><th>RPG 原始分</th><th>RPG 換算</th><th>最終總分</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<script>
const TOKEN_KEY='final-scoreboard-admin-token';const defaults=['數據鷹學派','金流獾學派','系統蛇學派','邏輯獅學派','管理狼學派'];const n=v=>Number.isFinite(Number(v))?Number(v):0;const fmt=v=>new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2}).format(v);const normal=s=>String(s||'').replace(/\s+/g,'').toLocaleUpperCase('zh-TW');const baseName=s=>normal(s).replace(/[\-_－]?([AB])隊?$/,'');let rows=[];
function token(){return localStorage.getItem(TOKEN_KEY)||''}async function api(path,options={}){const headers={...(options.body?{'Content-Type':'application/json'}:{}),...(token()?{Authorization:'Bearer '+token()}:{}),...(options.headers||{})};const res=await fetch(path,{...options,headers});let body={};try{body=await res.json()}catch{}if(res.status===401){localStorage.removeItem(TOKEN_KEY);showLogin()}return {res,body}}
function status(message,error=false){const e=document.querySelector('#status');e.textContent=message;e.classList.toggle('error',error)}function total(r){return n(r.match)+n(r.stock)+n(r.rpg)*1000}function mark(r,key){return r.sources?.[key]==='api'?'<span class="api-mark">API 帶入</span>':'<span class="manual-mark">手動／未設定</span>'}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function input(value,key,i,label,extra=''){return `<input type="number" step="0.01" inputmode="decimal" value="${esc(value)}" data-i="${i}" data-key="${key}" aria-label="${esc(label)}">${extra}`}
function render(){document.querySelector('#rows').innerHTML=rows.map((r,i)=>`<tr><td><input class="name-input" type="text" value="${esc(r.name)}" data-i="${i}" data-key="name" aria-label="第 ${i+1} 列學派名稱"></td><td>${input(r.match,'match',i,`${r.name} 對抗賽分數`)}</td><td>${input(r.stock,'stock',i,`${r.name} 賭大總資產`,mark(r,'stock'))}</td><td>${input(r.rpg,'rpg',i,`${r.name} RPG 原始分`,mark(r,'rpg'))}</td><td>${fmt(n(r.rpg)*1000)}</td><td class="total">${fmt(total(r))}</td></tr>`).join('')}
function showLogin(){document.querySelector('#editor').classList.add('hidden');document.querySelector('#logoutBtn').classList.add('hidden');document.querySelector('#loginPanel').classList.remove('hidden')}function showEditor(){document.querySelector('#loginPanel').classList.add('hidden');document.querySelector('#editor').classList.remove('hidden');document.querySelector('#logoutBtn').classList.remove('hidden')}
async function loadBoard(){const {res,body}=await api('/api/admin/scoreboard');if(!res.ok){if(res.status!==401)document.querySelector('#loginStatus').textContent=body.error||'無法載入資料';return}rows=body.rows||defaults.map(name=>({name,match:'',stock:'',rpg:'',sources:{}}));render();showEditor();status(body.updatedAt?`上次儲存：${new Date(body.updatedAt).toLocaleString('zh-TW')}`:'尚未儲存分數')}
document.querySelector('#loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.classList.add('loading');document.querySelector('#loginStatus').textContent='';try{const {res,body}=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});if(!res.ok)throw new Error(body.error||'登入失敗');localStorage.setItem(TOKEN_KEY,body.token);document.querySelector('#password').value='';await loadBoard()}catch(err){document.querySelector('#loginStatus').textContent=err.message}finally{button.classList.remove('loading')}});
document.querySelector('#rows').addEventListener('input',event=>{const el=event.target;if(!el.dataset.key)return;const row=rows[Number(el.dataset.i)],key=el.dataset.key;row[key]=el.value;if(['stock','rpg'].includes(key)){row.sources??={};row.sources[key]='manual'}render()});
async function loadSource(source,button){button.classList.add('loading');button.textContent='載入中…';status(`正在載入 ${source==='stock'?'賭大股票':'RPG'} API…`);try{const {res,body}=await api('/api/source/'+source);if(!res.ok)throw new Error(body.error||'API 載入失敗');const values=Array(rows.length).fill(0),matched=new Set(),unmatched=[];for(const entry of body.entries||[]){const entryName=normal(entry.name);let index=rows.findIndex(r=>normal(r.name)===entryName);if(index<0)index=rows.findIndex(r=>normal(r.name)===baseName(entryName));if(index<0){unmatched.push(entry.name);continue}values[index]+=n(entry.score);matched.add(index)}rows.forEach((r,i)=>{r[source]=matched.has(i)?values[i]:'';r.sources??={};r.sources[source]=matched.has(i)?'api':'manual'});render();status(unmatched.length?`已帶入 ${matched.size} 個學派；未對應：${unmatched.join('、')}`:`已帶入 ${matched.size} 個學派。`)}catch(err){status(err.message,true)}finally{button.classList.remove('loading');button.textContent=source==='stock'?'載入賭大 API':'載入 RPG API'}}
document.querySelectorAll('[data-source]').forEach(button=>button.addEventListener('click',()=>loadSource(button.dataset.source,button)));document.querySelector('#clearBtn').addEventListener('click',()=>{if(!confirm('確定清除賭大與 RPG 的來源分數嗎？'))return;rows.forEach(r=>{r.stock='';r.rpg='';r.sources={}});render();status('已清除來源分數，尚未儲存。')});document.querySelector('#saveBtn').addEventListener('click',async event=>{const button=event.currentTarget;button.classList.add('loading');try{const {res,body}=await api('/api/admin/scoreboard',{method:'PUT',body:JSON.stringify({rows})});if(!res.ok)throw new Error(body.error||'無法儲存分數');rows=body.rows;render();status(`已儲存：${new Date(body.updatedAt).toLocaleString('zh-TW')}`)}catch(err){status(err.message,true)}finally{button.classList.remove('loading')}});document.querySelector('#logoutBtn').addEventListener('click',async()=>{await api('/api/admin/logout',{method:'POST'});localStorage.removeItem(TOKEN_KEY);showLogin()});
(async()=>{if(token())await loadBoard();else showLogin()})();
</script>
</body>
</html>
