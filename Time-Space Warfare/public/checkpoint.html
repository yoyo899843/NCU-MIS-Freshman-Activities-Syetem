<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交摺點挑戰 - 時空戰爭</title>
<link rel="stylesheet" href="style.css">
<style>
  .hint { font-size: 0.85rem; color: var(--dim); }
  #reader { width: 100%; margin-bottom: 8px; }

  .qhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .qhead .idx { font-size: 0.85rem; color: var(--dim); }
  .timer { font-size: 1.6rem; font-weight: bold; font-variant-numeric: tabular-nums; }
  .timer.warn { color: var(--disrupt); }
  .bar { height: 6px; background: var(--card-2); border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
  .bar i { display: block; height: 100%; background: #2a7d2a; transition: width .2s linear; }
  .bar i.warn { background: #c0392b; }

  .qtext { font-size: 1.15rem; font-weight: bold; margin: 4px 0 14px; }
  .opt {
    display: block; width: 100%; text-align: left; padding: 14px;
    margin-bottom: 8px; font-size: 1rem; background: var(--card); color: var(--fg);
    border: 2px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  .opt:disabled { cursor: default; }
  .opt .lab { font-weight: bold; margin-right: 8px; }
  .opt.correct { border-color: var(--repair); background: #123322; }
  .opt.wrong { border-color: var(--disrupt); background: #3a1418; }

  .feedback { font-weight: bold; margin-top: 10px; }
  .feedback.ok { color: var(--repair); }
  .feedback.no { color: var(--disrupt); }

  .result-score { font-size: 2.2rem; font-weight: bold; font-variant-numeric: tabular-nums; }
  .faction-repair { color: var(--repair); }
  .faction-disrupt { color: var(--disrupt); }
</style>
</head>
<body>
<h1>交摺點挑戰</h1>

<div id="notLoggedIn" class="card" style="display:none">
  <p>請先<a href="login.html">登入</a>才能挑戰交摺點。</p>
</div>

<!-- 1. 掃碼 -->
<div id="scanStage" class="card" style="display:none">
  <p class="hint">把交摺點的 QR Code 對準相機；沒有相機或掃不到的話，也可以在下方手動輸入。</p>
  <div id="reader"></div>
  <input id="qrToken" placeholder="或手動輸入/貼上 QR Code 內容" autocomplete="off">
  <button id="startBtn">開始挑戰</button>
  <p id="scanError" class="error"></p>
</div>

<!-- 2. 答題 -->
<div id="quizStage" class="card" style="display:none">
  <div class="qhead">
    <span class="idx" id="qIndex"></span>
    <span class="timer" id="timer"></span>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <p class="qtext" id="qText"></p>
  <div id="options"></div>
  <p class="feedback" id="feedback"></p>
</div>

<!-- 3. 結算 -->
<div id="resultStage" class="card" style="display:none">
  <h3 id="resultTitle"></h3>
  <p>答對 <strong id="rCorrect"></strong> 題，本次得分</p>
  <p class="result-score" id="rScore"></p>
  <p id="rContribution"></p>
  <hr>
  <p id="rCheckpoint"></p>
  <p class="nav"><a href="map.html">看大地圖</a> <a href="checkpoint.html">再挑戰其他交摺點</a></p>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const token = localStorage.getItem('playerToken');
const playerInfo = JSON.parse(localStorage.getItem('playerInfo') || 'null');

const show = id => { document.getElementById(id).style.display = ''; };
const hide = id => { document.getElementById(id).style.display = 'none'; };
const $ = id => document.getElementById(id);

if (!token || !playerInfo) {
  show('notLoggedIn');
} else {
  show('scanStage');
  initScanner();
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, ch =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

// ---------- 掃碼 ----------
// 相機（getUserMedia）只有在安全情境（https 或 localhost）下瀏覽器才允許使用，
// 所以一律保留手動輸入這條路，掃不到也不會卡死。
function initScanner() {
  const qs = new URLSearchParams(location.search);
  const preset = qs.get('qrToken');
  if (preset) { $('qrToken').value = preset; }

  if (typeof Html5Qrcode === 'undefined') {
    $('scanError').textContent = '掃碼元件載入失敗，請改用下方手動輸入。';
    return;
  }
  const scanner = new Html5Qrcode('reader');
  scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 220 },
    text => { scanner.stop().catch(() => {}); startChallenge(text); },
    () => {}
  ).catch(err => {
    const reason = (err && (err.message || err.name)) || String(err);
    $('scanError').textContent = window.isSecureContext
      ? `無法啟動相機（${reason}），可以改用下方手動輸入。`
      : '這個頁面不是安全連線（需要 https 或 localhost），瀏覽器不允許使用相機。請改用下方手動輸入。';
  });
}

$('startBtn').addEventListener('click', () => startChallenge($('qrToken').value));

// ---------- 挑戰 ----------
let challengeId = null;
let current = null;      // 目前這一題
let ticker = null;       // 倒數計時器
let answering = false;   // 防止連點送出兩次

async function api(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify(body || {})
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* 非 JSON 回應（例如路徑打錯）就當空物件 */ }
  return { ok: res.ok, status: res.status, data };
}

async function startChallenge(rawToken) {
  const qr = (rawToken || '').trim();
  if (!qr) { $('scanError').textContent = '請先掃描或輸入 QR Code 內容。'; return; }
  $('scanError').textContent = '';

  const { ok, status, data } = await api(`/api/checkpoints/${encodeURIComponent(qr)}/challenge`);
  if (!ok) {
    $('scanError').textContent = data.error || `無法開始挑戰（${status}）`;
    return;
  }

  challengeId = data.challengeId;
  hide('scanStage');
  show('quizStage');
  renderQuestion(data.question);
}

function renderQuestion(q) {
  current = q;
  answering = false;
  $('feedback').textContent = '';
  $('qIndex').textContent = `第 ${q.questionIndex + 1} / ${q.totalQuestions} 題`;
  $('qText').textContent = q.content;

  $('options').innerHTML = ['A', 'B', 'C', 'D'].map(lab =>
    `<button class="opt" data-choice="${lab}">` +
      `<span class="lab">${lab}.</span>${escapeHtml(q.options[lab])}</button>`
  ).join('');
  $('options').querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => submit(btn.dataset.choice));
  });

  startTimer(q.timeLimitSeconds);
}

// 倒數歸零就自動送出「沒作答」（choice: null）。伺服器本身也會依實際經過時間
// 判定逾時，所以就算前端計時被暫停（切到背景分頁），分數也不會因此變寬鬆。
function startTimer(seconds) {
  const totalMs = seconds * 1000;
  const endAt = Date.now() + totalMs;
  clearInterval(ticker);

  const paint = () => {
    const leftMs = Math.max(0, endAt - Date.now());
    const leftSec = Math.ceil(leftMs / 1000);
    const warn = leftSec <= 3;
    $('timer').textContent = leftSec + ' 秒';
    $('timer').className = 'timer' + (warn ? ' warn' : '');
    $('bar').style.width = (leftMs / totalMs * 100) + '%';
    $('bar').className = warn ? 'warn' : '';
    if (leftMs <= 0) { clearInterval(ticker); submit(null); }
  };
  paint();
  ticker = setInterval(paint, 100);
}

async function submit(choice) {
  if (answering) return;
  answering = true;
  clearInterval(ticker);

  $('options').querySelectorAll('.opt').forEach(b => { b.disabled = true; });

  const { ok, status, data } = await api(
    `/api/checkpoints/challenge/${challengeId}/answer`,
    { questionIndex: current.questionIndex, choice }
  );
  if (!ok) {
    $('feedback').textContent = data.error || `送出失敗（${status}）`;
    $('feedback').className = 'feedback no';
    return;
  }

  // 標出正解，答錯的話也把玩家按的那顆標紅
  $('options').querySelectorAll('.opt').forEach(b => {
    if (b.dataset.choice === data.correctOption) b.classList.add('correct');
    else if (b.dataset.choice === choice) b.classList.add('wrong');
  });

  $('feedback').textContent = data.timedOut ? '時間到！這題 0 分'
    : data.correct ? `答對！＋${data.score} 分`
    : '答錯，這題 0 分';
  $('feedback').className = 'feedback ' + (data.correct ? 'ok' : 'no');

  // 留一下讓玩家看到正解再進下一題
  setTimeout(() => {
    if (data.finished) showResult(data.summary);
    else renderQuestion(data.nextQuestion);
  }, 1200);
}

function showResult(s) {
  hide('quizStage');
  show('resultStage');

  const isRepair = s.faction === 'repair';
  const factionName = isRepair ? '時空修復者' : '時空破壞者';
  const cls = isRepair ? 'faction-repair' : 'faction-disrupt';

  $('resultTitle').textContent = `${s.checkpoint.name} 挑戰結束`;
  $('rCorrect').textContent = `${s.correctCount} / ${s.totalQuestions}`;
  $('rScore').textContent = s.totalScore;
  $('rScore').className = 'result-score ' + cls;
  $('rContribution').innerHTML = s.totalScore > 0
    ? `已轉換為 <span class="${cls}"><strong>${factionName}</strong>的${isRepair ? '修復值' : '破壞值'}</span>累加到這個交摺點。`
    : '這次沒有得分，交摺點的數值沒有變化。';

  const lead = s.checkpoint.repairValue === s.checkpoint.disruptValue ? '目前平手'
    : s.checkpoint.repairValue > s.checkpoint.disruptValue ? '目前修復者領先' : '目前破壞者領先';
  $('rCheckpoint').innerHTML =
    `<strong>${escapeHtml(s.checkpoint.name)}</strong>　` +
    `<span class="faction-repair">修復 ${s.checkpoint.repairValue}</span> / ` +
    `<span class="faction-disrupt">破壞 ${s.checkpoint.disruptValue}</span>　${lead}`;
}
</script>
</body>
</html>
