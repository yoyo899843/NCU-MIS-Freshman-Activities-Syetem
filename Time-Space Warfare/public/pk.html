<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PK 對戰 - 時空戰爭</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>PK 對戰</h1>

<div id="notLoggedIn" class="card" style="display:none">
  <p>請先<a href="login.html">登入</a>才能發起或加入 PK。</p>
</div>

<div id="lobby" class="card" style="display:none">
  <button id="createBtn">發起 PK（開房）</button>
  <p id="createResult" class="error"></p>
  <hr>
  <input id="roomCodeInput" placeholder="輸入 6 碼房號">
  <button id="joinBtn">加入 PK</button>
  <p id="joinResult" class="error"></p>
</div>

<div id="waiting" class="card" style="display:none">
  <p>房號：<strong id="roomCodeDisplay" class="num" style="font-size:1.8rem"></strong></p>
  <p>把這組房號告訴對手，等待對方輸入加入...</p>
  <p id="roomCountdown" class="hint"></p>
  <button id="cancelRoomBtn" class="ghost">取消這個房間</button>
</div>

<div id="quiz" class="card" style="display:none">
  <p id="questionMeta"></p>
  <p id="timer"></p>
  <p id="questionContent" style="font-weight:bold"></p>
  <div id="options"></div>
</div>

<div id="resultCard" class="card" style="display:none">
  <p id="resultMessage" style="font-weight:bold"></p>
  <a href="pk.html">再來一場</a>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const token = localStorage.getItem('playerToken');
const playerInfo = JSON.parse(localStorage.getItem('playerInfo') || 'null');

if (!token || !playerInfo) {
  document.getElementById('notLoggedIn').style.display = '';
} else {
  document.getElementById('lobby').style.display = '';
  initPk();
}

function initPk() {
  const socket = io();
  let currentDuelId = null;
  let questionTimer = null;

  function hideAll() {
    ['lobby', 'waiting', 'quiz', 'resultCard'].forEach(id => {
      document.getElementById(id).style.display = 'none';
    });
  }

  // ---- 進場（pk:enter） ----
  // 房主開房的當下，伺服器只寫了 DB，還沒有 in-memory session（session 是對手
  // 呼叫 /api/pk/join 時才建立的）。所以房主第一次 pk:enter 一定會拿到
  // 'duel session not found'——這時候**必須重試**，不能放棄：
  // 進場失敗的話伺服器不會把這個 socket 加進 duel room，房主就永遠不算「已到齊」，
  // 第一題永遠不會送出，兩邊一起卡死（也收不到 pk:result）。
  // 對手一 join、session 一建立，下一次重試就會成功，雙方到齊、第一題送出。
  let enterRetryTimer = null;
  let enteredDuel = false;      // pk:enter 是否已經成功（成功＝對手已加入、session 已建立）
  function stopEnterRetry() {
    if (enterRetryTimer) { clearTimeout(enterRetryTimer); enterRetryTimer = null; }
  }
  function enterDuel(duelId, statusEl) {
    stopEnterRetry();
    const attempt = () => {
      socket.emit('pk:enter', { duelId, token }, ack => {
        if (ack && ack.ok) {
          enteredDuel = true;
          stopEnterRetry();
          return;
        }
        const err = (ack && ack.error) || '未知錯誤';
        if (err === 'duel session not found') {
          // 正常狀況：對手還沒加入，session 還沒生出來。安靜重試。
          enterRetryTimer = setTimeout(attempt, 1500);
          return;
        }
        // 其他錯誤（token 失效、不是這場的玩家）重試也沒用，直接顯示
        stopEnterRetry();
        if (statusEl) statusEl.textContent = '進入對戰失敗：' + err;
      });
    };
    attempt();
  }

  // 每次「連上」都會執行(包含第一次連線，以及斷線後 Socket.IO 自動重連的那次)。
  // 只要頁面還記得自己正在哪場對戰(currentDuelId 沒被清掉)，就自動重新 pk:enter 歸隊，
  // 不用玩家自己重新操作。伺服器那邊如果對戰已經在進行中，會直接補送目前題目的進度。
  socket.on('connect', () => {
    if (!currentDuelId) return;
    enterDuel(currentDuelId, document.getElementById('createResult'));
  });

  // 開賽逾時：雙方沒到齊，伺服器取消這場（不判輸、不扣分、沒有保護期）
  socket.on('pk:cancelled', data => {
    stopEnterRetry();
    backToLobby((data && data.message) || '這場對戰已取消。');
  });

  document.getElementById('createBtn').addEventListener('click', async () => {
    const el = document.getElementById('createResult');
    const res = await fetch('/api/pk/create', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token }
    });
    const data = await res.json();
    if (!res.ok) {
      el.textContent = `失敗 (${res.status}): ${data.error || ''}`;
      return;
    }
    currentDuelId = data.duelId;
    enterDuel(currentDuelId, el);
    hideAll();
    document.getElementById('waiting').style.display = '';
    document.getElementById('roomCodeDisplay').textContent = data.roomCode;
    startRoomCountdown(data.expiresInMs);
  });

  // 沒人加入的房間伺服器會自動取消（見 src/pk/roomRegistry.js）。這裡跑一份同步
  // 的倒數，時間到就把畫面收回大廳——不然玩家會一直盯著一組其實已經失效的房號。
  let roomTimer = null;
  function stopRoomCountdown() {
    if (roomTimer) { clearInterval(roomTimer); roomTimer = null; }
    document.getElementById('roomCountdown').textContent = '';
  }
  function backToLobby(message) {
    stopRoomCountdown();
    stopEnterRetry();
    enteredDuel = false;
    currentDuelId = null;
    hideAll();
    document.getElementById('lobby').style.display = '';
    document.getElementById('createResult').textContent = message || '';
  }
  function startRoomCountdown(expiresInMs) {
    const endAt = Date.now() + (expiresInMs || 150000);
    const el = document.getElementById('roomCountdown');
    stopRoomCountdown();
    const paint = () => {
      // 已經進場成功＝對手其實已經加入了，只是還沒連上 socket。這時候房間倒數
      // 已經沒有意義，絕對不能自己把畫面收掉、也不能停掉重試或清掉 currentDuelId
      // ——那樣會把一場其實還活著的對戰從前端這邊硬生生斷掉。
      // 這場到底作不作廢由伺服器的開賽逾時決定，前端等 pk:cancelled 就好。
      if (enteredDuel) {
        el.textContent = '對手已加入，還在等對手連線進場…';
        return;
      }
      const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
      el.textContent = `${left} 秒內沒有人加入的話，這個房間會自動取消。`;
      if (left <= 0) backToLobby('房間已逾時自動取消，請重新開房。');
    };
    paint();
    roomTimer = setInterval(paint, 1000);
  }

  document.getElementById('cancelRoomBtn').addEventListener('click', () => {
    backToLobby('已取消房間。');
  });

  document.getElementById('joinBtn').addEventListener('click', async () => {
    const roomCode = document.getElementById('roomCodeInput').value.trim();
    const el = document.getElementById('joinResult');
    if (!roomCode) { el.textContent = '請輸入房號'; return; }

    const res = await fetch('/api/pk/join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ roomCode })
    });
    const data = await res.json();
    if (!res.ok) {
      el.textContent = `失敗 (${res.status}): ${data.error || ''}`;
      return;
    }
    currentDuelId = data.duelId;
    enterDuel(currentDuelId, el);
    hideAll();
    document.getElementById('quiz').style.display = '';
    document.getElementById('questionContent').textContent = '等待對戰開始...';
    document.getElementById('options').innerHTML = '';
  });

  socket.on('pk:question', q => {
    stopRoomCountdown();   // 對戰真的開始了，房間倒數就不用再跑
    stopEnterRetry();
    hideAll();
    document.getElementById('quiz').style.display = '';
    hideAll();
    document.getElementById('quiz').style.display = '';
    document.getElementById('questionMeta').textContent = `第 ${q.questionIndex + 1} / ${q.totalQuestions} 題`;
    document.getElementById('questionContent').textContent = q.content;

    const optionsEl = document.getElementById('options');
    optionsEl.innerHTML = '';
    Object.entries(q.options).forEach(([key, text]) => {
      const btn = document.createElement('button');
      btn.textContent = `${key}. ${text}`;
      btn.addEventListener('click', () => {
        optionsEl.querySelectorAll('button').forEach(b => b.disabled = true);
        socket.emit('pk:answer', {
          duelId: currentDuelId,
          questionIndex: q.questionIndex,
          selectedOption: key
        });
      });
      optionsEl.appendChild(btn);
    });

    let remaining = q.timeLimitSeconds;
    document.getElementById('timer').textContent = `剩餘 ${remaining} 秒`;
    if (questionTimer) clearInterval(questionTimer);
    questionTimer = setInterval(() => {
      remaining -= 1;
      document.getElementById('timer').textContent = `剩餘 ${Math.max(remaining, 0)} 秒`;
      if (remaining <= 0) clearInterval(questionTimer);
    }, 1000);
  });

  // 重連後發現自己這一題其實已經作答過了，顯示等待對手，而不是讓玩家誤以為能重新選。
  socket.on('pk:waiting', ({ questionIndex }) => {
    if (questionTimer) clearInterval(questionTimer);
    hideAll();
    document.getElementById('quiz').style.display = '';
    document.getElementById('questionMeta').textContent = `第 ${questionIndex + 1} 題`;
    document.getElementById('timer').textContent = '';
    document.getElementById('questionContent').textContent = '你已經作答過這一題，等待對手...';
    document.getElementById('options').innerHTML = '';
  });

  socket.on('pk:result', result => {
    if (questionTimer) clearInterval(questionTimer);
    hideAll();
    document.getElementById('resultCard').style.display = '';

    const won = result.winnerPlayerId === playerInfo.player.id;
    const byForfeit = result.reason === 'opponent_disconnected';
    let text = won
      ? (byForfeit ? '對方斷線超過 20 秒未回來，判你獲勝！' : '對戰勝利！')
      : (byForfeit ? '你斷線超過 20 秒未回來，判對方獲勝。' : '對戰失敗！');
    if (!won) {
      text += result.penalty && result.penalty.amount > 0
        ? ` 你的小隊在最近一個交摺點的 ${result.penalty.amount} 分已被扣除。`
        : ' 你的小隊尚未有交摺點積分，不扣分。';
    }
    document.getElementById('resultMessage').textContent = text;
  });
}
</script>
</body>
</html>
