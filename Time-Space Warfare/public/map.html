<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大地圖 - 時空戰爭</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { max-width: none; padding: 0; }
  #map { height: 100vh; width: 100%; }
  .top-bar {
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    z-index: 1000;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="top-bar">
  <strong>大地圖</strong> — 骨架階段：交摺點狀態待下一輪串接。
  <span id="checkpointStatus"></span>
  <span id="teamStatus"></span>
</div>
<div id="map"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="geofence.js"></script>
<script>
const token = localStorage.getItem('playerToken');
const playerInfo = JSON.parse(localStorage.getItem('playerInfo') || 'null');

// 校園 bounding box（跟 geofence.js 的 CAMPUS_BOUNDS 是同一個範圍）
const BOUNDS = L.latLngBounds(
  [24.964764, 121.184735],
  [24.972425, 121.197936]
);
const CENTER = BOUNDS.getCenter();

const map = L.map('map', {
  minZoom: 15,
  maxZoom: 19,
  maxBounds: BOUNDS.pad(0.1),
  maxBoundsViscosity: 1.0
}).setView(CENTER, 17);

// 自行 host 的校園範圍 tile 圖磚（活動籌備期間用 scripts/download-tiles.js 下載），
// 不對外連任何 tile server。
L.tileLayer('/tiles/{z}/{x}/{y}.png', {
  minZoom: 15,
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
}).addTo(map);

// 交摺點標記：等 /api/map/checkpoints 接上真實資料後，這裡改成畫 9 個交摺點
// 的位置 + 修復值/破壞值進度條。目前先呼叫 stub API 確認串接得起來。
fetch('/api/map/checkpoints')
  .then(res => res.json().then(data => ({ ok: res.ok, status: res.status, data })))
  .then(({ ok, status, data }) => {
    document.getElementById('checkpointStatus').textContent = ok
      ? `（${data.length || 0} 個交摺點）`
      : `（交摺點資料尚未實作，${status}）`;
  })
  .catch(() => {
    document.getElementById('checkpointStatus').textContent = '（連線失敗）';
  });

// 隊友即時定位：只有同隊隊友之間可見彼此座標（伺服器只把 team:location 轉發到
// 'team:<teamId>' room），看不到敵方。座標刻意不落地到 DB，斷線就會從地圖上消失。
const teammateMarkers = new Map(); // playerId -> L.Marker

// 自己的位置：不用等伺服器廣播（伺服器本來就不會把座標送回發送者自己），
// 收到 GPS 更新的當下直接畫在地圖上，用跟隊友不同的樣式（藍色圓點）分辨。
let selfMarker = null;
function updateSelfMarker(lat, lng) {
  if (!selfMarker) {
    selfMarker = L.circleMarker([lat, lng], {
      radius: 8,
      color: '#06c',
      fillColor: '#06c',
      fillOpacity: 0.9
    }).addTo(map).bindTooltip('你的位置', { permanent: true });
  } else {
    selfMarker.setLatLng([lat, lng]);
  }
}

if (token && playerInfo) {
  const socket = io();

  socket.on('connect', () => {
    socket.emit('team:enter', { token }, ack => {
      document.getElementById('teamStatus').textContent = ack?.ok
        ? '（隊友定位已連線）'
        : '（隊友定位連線失敗）';
    });
  });

  socket.on('team:location', ({ playerId, displayName, lat, lng }) => {
    let marker = teammateMarkers.get(playerId);
    if (!marker) {
      marker = L.marker([lat, lng]).addTo(map).bindTooltip(displayName || '隊友', { permanent: true });
      teammateMarkers.set(playerId, marker);
    } else {
      marker.setLatLng([lat, lng]);
    }
  });

  socket.on('team:left', ({ playerId }) => {
    const marker = teammateMarkers.get(playerId);
    if (marker) {
      map.removeLayer(marker);
      teammateMarkers.delete(playerId);
    }
  });

  startGeofence((lat, lng) => {
    updateSelfMarker(lat, lng);
    socket.emit('team:location', { lat, lng });
  });
} else {
  document.getElementById('teamStatus').textContent = '（未登入，不分享/顯示隊友定位）';
  startGeofence(updateSelfMarker);
}
</script>
</body>
</html>
