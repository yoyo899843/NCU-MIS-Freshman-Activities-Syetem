<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大地圖 - 時空戰爭</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* 版面改成「上面一條 bar、下面整塊地圖」的正常排版，而不是把 bar 浮在地圖上。
     原本 .top-bar 是 position:absolute 疊在地圖上，剛好壓住 Leaflet 左上角的
     縮放 +/- 按鈕，放大縮小要盲點。改成正常流之後就不會互相蓋到。 */
  html, body { height: 100%; }
  body { max-width: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
  #map { flex: 1; min-height: 0; width: 100%; }
  .legend { margin-top: 6px; font-size: 0.78rem; color: var(--dim); }
  .legend span { margin-right: 10px; white-space: nowrap; }
  .legend .sw {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 4px; vertical-align: -1px;
  }
  .legend .sw.repair { background: #0d7550; }
  .legend .sw.disrupt { background: #c0392b; }
  .legend .sw.tie { background: #646c75; }

  /* 交摺點標記：刻意做成方形資訊牌，跟玩家的圓點一眼就分得出來 */
  .cp-marker {
    background: var(--card); border: 2px solid var(--line); border-radius: 6px;
    padding: 3px 6px; white-space: nowrap; text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 11px; line-height: 1.35;
  }
  .cp-marker.repair { border-color: var(--repair); }
  .cp-marker.disrupt { border-color: var(--disrupt); }
  .cp-marker .cp-name { font-weight: 700; color: var(--fg); }
  .cp-marker .cp-vals { font-variant-numeric: tabular-nums; }
  /* 修復/破壞的比例條。底色是破壞、上面疊修復的寬度，兩段加起來就是整條。
     min-width 是為了名字很短的交摺點——條子太短看不出比例。 */
  .cp-marker .cp-bar {
    display: block; min-width: 76px; height: 5px; margin: 3px 0 2px;
    border-radius: 3px; overflow: hidden; background: var(--disrupt);
  }
  .cp-marker .cp-bar > i { display: block; height: 100%; background: var(--repair); }
  .cp-marker .cp-bar.empty { background: var(--line); }
  .cp-marker .cp-r { color: var(--repair); font-weight: 700; }
  .cp-marker .cp-d { color: var(--disrupt); font-weight: 700; }
  .cp-marker .cp-lead {
    display: block; margin-top: 1px; font-size: 10px; font-weight: 700; color: #fff;
    border-radius: 3px; padding: 0 3px;
  }
  .cp-marker.repair .cp-lead { background: #0d7550; }
  .cp-marker.disrupt .cp-lead { background: #c0392b; }
  .cp-marker.tie .cp-lead { background: #646c75; }

  .top-bar {
    flex: none;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 8px 12px;
    font-size: 0.9rem;
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px;
  }
  .top-bar .back {
    color: var(--accent); text-decoration: none; font-weight: 700;
    /* 手指點得到的大小，不要只有一行小字 */
    padding: 4px 8px; margin: -4px 0 -4px -8px; border-radius: 4px;
  }
  .top-bar .back:hover, .top-bar .back:active { background: var(--card-3); }
</style>
</head>
<body>
<div class="top-bar">
  <a class="back" href="index.html">&laquo; 回首頁</a>
  <strong>大地圖</strong>
  <span id="checkpointStatus"></span>
  <span id="locationStatus"></span>
  <div class="legend">
    <span><i class="sw repair"></i>修復者領先</span>
    <span><i class="sw disrupt"></i>破壞者領先</span>
    <span><i class="sw tie"></i>平手／未得分</span>
  </div>
</div>
<div id="map"></div>

<script src="authFetch.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="geofence.js"></script>
<script>
const token = localStorage.getItem('playerToken');
const playerInfo = JSON.parse(localStorage.getItem('playerInfo') || 'null');

// 每 2 秒才動作一次——不是每次 GPS 更新就打一次 API，也不是即時推播：
// 上傳自己的座標、以及跟伺服器要一次所有人目前的座標，都改成固定週期的 REST
// 輪詢（見 src/routes/locations.js），不再用 Socket.IO。
const LOCATION_INTERVAL_MS = 2000;

// 遊戲範圍。數值跟 geofence.js 的 CAMPUS_BOUNDS 相同，但兩者是不同的東西：
// 那邊管「離開這個範圍就不能玩」，這邊只拿來決定開場要框住哪一塊。
const BOUNDS = L.latLngBounds(
  [24.964764, 121.184735],
  [24.972425, 121.197936]
);

// 地圖能拖到哪、能縮多小，取決於磁碟上真的有圖磚的範圍，跟遊戲範圍是兩回事。
// scripts/download-tiles.js 是以 BOUNDS 去抓，但圖磚是切齊格線的，每一級實際
// 蓋到的矩形都不一樣大（z15 往外多很多，z19 最貼）；能安全走動的只有「每一級
// 都蓋得到」的交集，也就是 z19 那塊，再往內縮 3 公尺避開格線本身：
//   lat 24.964273~24.972987, lng 121.184692~121.198425（z19 圖磚涵蓋範圍）
// 這塊完整包住 BOUNDS，所以玩家看得到全部交摺點。圖磚重抓過的話這裡要一起改。
//
// 原本這裡是 BOUNDS.pad(0.1)，四個方向都超出圖磚範圍，拖到邊緣就是一片空白。
const TILE_BOUNDS = L.latLngBounds(
  [24.964300, 121.184722],
  [24.972960, 121.198396]
);

const map = L.map('map', {
  maxZoom: 19,
  maxBounds: TILE_BOUNDS,
  maxBoundsViscosity: 1.0
});

// minZoom 是「最多能縮多小」。原本寫死 15，但 z15 的圖磚總共只有 512x512 px，
// 鋪不滿一個螢幕——縮到底看到的是校園變一個小點、四周一大片灰，等於沒有下限。
//
// 正確的下限是「TILE_BOUNDS 剛好還鋪得滿整個畫面」的那一級，而它跟螢幕大小
// 有關，不是固定值（#map 是 100vh，畫面多大就要鋪多大）：TILE_BOUNDS 在 z17
// 是 1274x890 px，手機夠鋪滿，但 1440px 寬的桌機左右兩側就會露出灰邊。所以交
// 給 Leaflet 依當下畫面去算（getBoundsZoom 第二個參數 inside=true 就是問「哪
// 一級才能讓這塊範圍蓋滿整個畫面」），轉螢幕方向、改視窗大小時重算。
function applyMinZoom() {
  const fill = map.getBoundsZoom(TILE_BOUNDS, true);
  map.setMinZoom(Math.min(fill, map.getMaxZoom()));
}

// 先算下限、再 fitBounds，順序不能反過來：fitBounds 是「把整塊範圍塞進畫面裡」，
// 在還沒有下限的狀態下它會一路縮到 z15/z16，載入的瞬間就閃一下缺圖。
applyMinZoom();
map.fitBounds(BOUNDS);
map.on('resize', applyMinZoom);
// GPS 圍籬的提示條出現/消失會改變地圖容器的高度，但那不是視窗 resize，Leaflet
// 不會自己發現，會繼續用舊尺寸繪製（底部露灰帶、點到的座標也會偏）。盯著容器
// 本身，尺寸一變就叫 Leaflet 重新量。
new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('map'));


// 自行 host 的校園範圍 tile 圖磚（活動籌備期間用 scripts/download-tiles.js 下載），
// 不對外連任何 tile server。
// 這裡的 minZoom/maxZoom 說的是「磁碟上有哪幾級的圖磚」（download-tiles.js 抓了
// 15~19），不是使用者能縮到哪——那個由上面 map 的 minZoom 決定。兩者刻意分開：
// 小螢幕上 applyMinZoom 有可能算出 16，這一層要放得比它寬才不會整片空白。
L.tileLayer('/tiles/{z}/{x}/{y}.png', {
  minZoom: 15,
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
}).addTo(map);

// 交摺點：畫出位置，並用外框顏色 + 標籤直接標示目前是哪一邊領先。
// 這支 API 不需要登入（交摺點戰況是公開資訊，大會投影 Dashboard 也用同一支）。
const CHECKPOINT_INTERVAL_MS = 5000;
const checkpointMarkers = new Map(); // checkpointId -> L.Marker

const LEAD_LABEL = { repair: '修復者領先', disrupt: '破壞者領先', tie: '平手' };

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, ch =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

// 一條把「修復 vs 破壞」畫成比例的橫條。數字要看清楚得停下來讀，走在路上抬頭
// 掃一眼只想知道「這個點現在偏哪邊、差多少」，那是長度比文字快的事。
function checkpointBar(cp) {
  const repair = Number(cp.repairValue) || 0;
  const disrupt = Number(cp.disruptValue) || 0;
  const total = repair + disrupt;
  // 兩邊都還是 0：畫一條中立的空條，不要畫成 50/50——那看起來像「兩邊平分」，
  // 但實際狀況是「還沒有人碰過這個點」，意思完全不一樣。
  if (total === 0) return '<span class="cp-bar empty"></span>';
  const pct = Math.round((repair / total) * 1000) / 10;
  return `<span class="cp-bar"><i style="width:${pct}%"></i></span>`;
}

function checkpointIcon(cp) {
  const lead = cp.leading || 'tie';
  // 顏色只是輔助，領先方另外用文字寫出來——色盲/大太陽下看不出顏色也能判讀。
  // 比例條同理，是加在數字旁邊的輔助，不是拿來取代數字或「領先」那行字的。
  const html =
    `<div class="cp-marker ${lead}">` +
      `<span class="cp-name">${escapeHtml(cp.name)}</span>` +
      checkpointBar(cp) +
      `<span class="cp-vals"><span class="cp-r">修復 ${cp.repairValue}</span>` +
      ` / <span class="cp-d">破壞 ${cp.disruptValue}</span></span>` +
      `<span class="cp-lead">${LEAD_LABEL[lead]}</span>` +
    `</div>`;
  return L.divIcon({ html, className: '', iconSize: null, iconAnchor: [0, 0] });
}

function renderCheckpoints(list) {
  const withCoords = list.filter(cp => cp.lat != null && cp.lng != null);
  const missing = list.length - withCoords.length;
  document.getElementById('checkpointStatus').textContent =
    `（${list.length} 個交摺點${missing ? `，${missing} 個尚未設定座標` : ''}）`;

  withCoords.forEach(cp => {
    const existing = checkpointMarkers.get(cp.id);
    if (existing) {
      existing.setLatLng([cp.lat, cp.lng]);
      existing.setIcon(checkpointIcon(cp));
    } else {
      // 交摺點壓在玩家標記底下（zIndexOffset 負值），才不會擋住走動中的隊伍
      const marker = L.marker([cp.lat, cp.lng], {
        icon: checkpointIcon(cp),
        zIndexOffset: -500,
        interactive: false
      }).addTo(map);
      checkpointMarkers.set(cp.id, marker);
    }
  });
}

function loadCheckpoints() {
  fetch('/api/map/checkpoints')
    .then(res => (res.ok ? res.json() : Promise.reject(res.status)))
    .then(renderCheckpoints)
    .catch(() => {
      document.getElementById('checkpointStatus').textContent = '（交摺點載入失敗）';
    });
}

loadCheckpoints();
setInterval(loadCheckpoints, CHECKPOINT_INTERVAL_MS);

// 自己的位置：不用等伺服器回應，收到 GPS 更新的當下直接畫在地圖上，
// 用跟其他人不同的樣式（藍色圓點）分辨。
let selfMarker = null;
function updateSelfMarker(lat, lng) {
  if (!selfMarker) {
    selfMarker = L.circleMarker([lat, lng], {
      radius: 8,
      color: '#06c',
      fillColor: '#06c',
      fillOpacity: 0.9
    }).addTo(map).bindTooltip('你的位置', { permanent: true });
  } else {
    selfMarker.setLatLng([lat, lng]);
  }
}

if (token && playerInfo) {
  document.getElementById('locationStatus').textContent = '（定位分享中）';

  // 大地圖上其他隊伍一律是「匿名圓點」：同一種顏色、沒有代號、沒有陣營。
  // 這是遊戲機制的一部分而不是隱私考量——玩家要靠「某據點進度驟降」搭配「當時
  // 停留在那裡的圓點」自己推理內鬼身分（見 溫馨周企劃.pdf）。標記如果寫著隊名
  // 跟陣營，抓內鬼這件事就不用玩了。伺服器端也不會發出這些欄位，見
  // src/playerLocations.js。
  //
  // 座標刻意不落地到 DB，但關掉瀏覽器/斷線也不會讓標記消失：伺服器一直保留每支
  // 隊伍最後一次回報的座標，只是標記會從「連線中」（實心）變成「離線」（半透明），
  // 見下面的 live 欄位。軌跡要連得起來，所以每筆帶一個匿名 id 當標記的鍵。
  const otherMarkers = new Map(); // 匿名 id -> L.CircleMarker
  const OTHER_COLOR = '#8fa3b8'; // 中性灰藍，跟自己的藍點、跟兩個陣營色都不撞

  // live=false 時，用最後上傳時間（updatedAt）換算成「X 分鐘前」；剛斷線不到
  // 一分鐘先顯示「剛離線」，不然會一直卡在「0 分鐘前」很奇怪。
  function statusText(player) {
    if (player.live) return '現在';
    const minutes = Math.floor((Date.now() - player.updatedAt) / 60000);
    return minutes < 1 ? '剛離線' : `${minutes} 分鐘前`;
  }

  // 目前收到的最新一次 GPS 讀值，每 2 秒的上傳計時器讀這個變數，
  // 跟 geofence.js 實際多快收到新讀值（可能比 2 秒快很多）脫鉤。
  let latestCoords = null;
  startGeofence((lat, lng) => {
    latestCoords = { lat, lng };
    updateSelfMarker(lat, lng);
  });

  setInterval(() => {
    if (!latestCoords) return;
    fetch('/api/locations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(latestCoords)
    }).catch(() => {}); // 單次上傳失敗不用特別處理，反正 2 秒後會再傳一次
  }, LOCATION_INTERVAL_MS);

  setInterval(() => {
    fetch('/api/locations', { headers: { Authorization: 'Bearer ' + token } })
      .then(res => res.json())
      .then(players => {
        // 這裡回來的名單不會因為斷線而少人，所以不用做「消失名單裡沒有的標記」
        // 那種清理——每個人只會一直被更新（位置 + 連線狀態），不會被移除。
        players.forEach(p => {
          // 自己不在這份清單裡（伺服器就沒回），所以不用另外過濾。
          //
          // tooltip 不設 permanent：二十顆點各掛一張「其他隊伍」的常駐標籤只是
          // 把地圖糊掉，而且真正有用的資訊是「這顆點現在在哪」。要看新舊點一下
          // 就好。內容也只有連線狀態，沒有任何身分資訊。
          const tooltipText = escapeHtml(`其他隊伍（${statusText(p)}）`);

          let marker = otherMarkers.get(p.id);
          if (!marker) {
            marker = L.circleMarker([p.lat, p.lng], {
              radius: 8,
              color: OTHER_COLOR,
              fillColor: OTHER_COLOR,
              fillOpacity: p.live ? 0.85 : 0.35
            }).addTo(map).bindTooltip(tooltipText);
            otherMarkers.set(p.id, marker);
          } else {
            marker.setLatLng([p.lat, p.lng]);
            marker.setStyle({ fillOpacity: p.live ? 0.85 : 0.35 });
            marker.setTooltipContent(tooltipText);
          }
        });
      })
      .catch(() => {});
  }, LOCATION_INTERVAL_MS);
} else {
  document.getElementById('locationStatus').textContent = '（未登入，不分享/顯示其他人的定位）';
  startGeofence(updateSelfMarker);
}
</script>
</body>
</html>
