<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大地圖 - 時空戰爭</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { max-width: none; padding: 0; }
  #map { height: 100vh; width: 100%; }
  .top-bar {
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    z-index: 1000;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="top-bar">
  <strong>大地圖</strong> — 骨架階段：交摺點狀態待下一輪串接。
  <span id="checkpointStatus"></span>
  <span id="locationStatus"></span>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="geofence.js"></script>
<script>
const token = localStorage.getItem('playerToken');
const playerInfo = JSON.parse(localStorage.getItem('playerInfo') || 'null');

// 每 2 秒才動作一次——不是每次 GPS 更新就打一次 API，也不是即時推播：
// 上傳自己的座標、以及跟伺服器要一次所有人目前的座標，都改成固定週期的 REST
// 輪詢（見 src/routes/locations.js），不再用 Socket.IO。
const LOCATION_INTERVAL_MS = 2000;

// 校園 bounding box（跟 geofence.js 的 CAMPUS_BOUNDS 是同一個範圍）
const BOUNDS = L.latLngBounds(
  [24.964764, 121.184735],
  [24.972425, 121.197936]
);
const CENTER = BOUNDS.getCenter();

const map = L.map('map', {
  minZoom: 15,
  maxZoom: 19,
  maxBounds: BOUNDS.pad(0.1),
  maxBoundsViscosity: 1.0
}).setView(CENTER, 17);

// 自行 host 的校園範圍 tile 圖磚（活動籌備期間用 scripts/download-tiles.js 下載），
// 不對外連任何 tile server。
L.tileLayer('/tiles/{z}/{x}/{y}.png', {
  minZoom: 15,
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
}).addTo(map);

// 交摺點標記：等 /api/map/checkpoints 接上真實資料後，這裡改成畫 9 個交摺點
// 的位置 + 修復值/破壞值進度條。目前先呼叫 stub API 確認串接得起來。
fetch('/api/map/checkpoints')
  .then(res => res.json().then(data => ({ ok: res.ok, status: res.status, data })))
  .then(({ ok, status, data }) => {
    document.getElementById('checkpointStatus').textContent = ok
      ? `（${data.length || 0} 個交摺點）`
      : `（交摺點資料尚未實作，${status}）`;
  })
  .catch(() => {
    document.getElementById('checkpointStatus').textContent = '（連線失敗）';
  });

// 自己的位置：不用等伺服器回應，收到 GPS 更新的當下直接畫在地圖上，
// 用跟其他人不同的樣式（藍色圓點）分辨。
let selfMarker = null;
function updateSelfMarker(lat, lng) {
  if (!selfMarker) {
    selfMarker = L.circleMarker([lat, lng], {
      radius: 8,
      color: '#06c',
      fillColor: '#06c',
      fillOpacity: 0.9
    }).addTo(map).bindTooltip('你的位置', { permanent: true });
  } else {
    selfMarker.setLatLng([lat, lng]);
  }
}

if (token && playerInfo) {
  document.getElementById('locationStatus').textContent = '（定位分享中）';

  // 大地圖直接顯示所有人的位置，不分陣營、不分隊伍——不用等隊友，任何登入的
  // 玩家都看得到彼此。座標刻意不落地到 DB，斷線太久（伺服器端判斷超過 6 秒
  // 沒收到更新）就會自動從別人的地圖上消失，不用額外處理「離線通知」。
  const otherMarkers = new Map(); // playerId -> L.CircleMarker
  const selfPlayerId = playerInfo.player.id;

  function factionColor(faction) {
    return faction === 'repair' ? '#2a8' : '#c00';
  }
  function factionLabel(faction) {
    return faction === 'repair' ? '時空修復者' : '時空破壞者';
  }

  // 目前收到的最新一次 GPS 讀值，每 2 秒的上傳計時器讀這個變數，
  // 跟 geofence.js 實際多快收到新讀值（可能比 2 秒快很多）脫鉤。
  let latestCoords = null;
  startGeofence((lat, lng) => {
    latestCoords = { lat, lng };
    updateSelfMarker(lat, lng);
  });

  setInterval(() => {
    if (!latestCoords) return;
    fetch('/api/locations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(latestCoords)
    }).catch(() => {}); // 單次上傳失敗不用特別處理，反正 2 秒後會再傳一次
  }, LOCATION_INTERVAL_MS);

  setInterval(() => {
    fetch('/api/locations', { headers: { Authorization: 'Bearer ' + token } })
      .then(res => res.json())
      .then(players => {
        const seenIds = new Set();
        players.forEach(p => {
          if (p.playerId === selfPlayerId) return; // 自己已經用 selfMarker 畫過了
          seenIds.add(p.playerId);

          let marker = otherMarkers.get(p.playerId);
          if (!marker) {
            marker = L.circleMarker([p.lat, p.lng], {
              radius: 8,
              color: factionColor(p.faction),
              fillColor: factionColor(p.faction),
              fillOpacity: 0.85
            }).addTo(map).bindTooltip(`${p.displayName || '?'}（${factionLabel(p.faction)}）`, { permanent: true });
            otherMarkers.set(p.playerId, marker);
          } else {
            marker.setLatLng([p.lat, p.lng]);
          }
        });

        // 伺服器回傳的名單裡已經不在的人（斷線太久被判定離線），把標記移除。
        otherMarkers.forEach((marker, playerId) => {
          if (!seenIds.has(playerId)) {
            map.removeLayer(marker);
            otherMarkers.delete(playerId);
          }
        });
      })
      .catch(() => {});
  }, LOCATION_INTERVAL_MS);
} else {
  document.getElementById('locationStatus').textContent = '（未登入，不分享/顯示其他人的定位）';
  startGeofence(updateSelfMarker);
}
</script>
</body>
</html>
