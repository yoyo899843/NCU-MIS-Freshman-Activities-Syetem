services:
  app:
    build: .
    container_name: timewarfare-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "9001:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ncumis-camp
      - timewarfare-internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: timewarfare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timewarfare-db-data:/var/lib/postgresql/data
    networks:
      - timewarfare-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timewarfare-db-data:

networks:
  ncumis-camp:
    external: true
  # 固定命名，讓 PgAdmin 的獨立 compose 專案可以用 external:true 加入。
  timewarfare-internal:
    name: timewarfare-internal
