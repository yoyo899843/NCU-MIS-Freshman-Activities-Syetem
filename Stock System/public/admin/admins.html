<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理端帳號 - 賭大股票系統</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="wide">
<a class="back" href="index.html"><i data-icon="back"></i>回後台</a>
<h1>管理端帳號</h1>
<p class="hint">兩種權限：<strong>主辦</strong>什麼都能做；<strong>銀行關主</strong>只能核准／駁回存款申報，其餘寫入操作一律被伺服器擋下。</p>

<form class="card" id="addForm" onsubmit="return false">
  <h2><i data-icon="users"></i>新增帳號</h2>
  <div class="field-row">
    <div><label for="newEmail">Email</label><input id="newEmail" type="email" autocomplete="off" autocapitalize="off"></div>
    <div><label for="newPassword">密碼（至少 8 字元）</label><input id="newPassword" type="password" autocomplete="new-password"></div>
    <div><label for="newName">顯示名稱（選填）</label><input id="newName"></div>
    <div><label for="newRole">權限</label>
      <select id="newRole"><option value="banker">銀行關主</option><option value="admin">主辦（管理員）</option></select></div>
  </div>
  <p class="error" id="addErr" role="alert"></p>
  <button id="addBtn" type="submit" style="max-width:240px">新增帳號</button>
</form>

<section class="card">
  <h2><i data-icon="key"></i>帳號清單</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Email</th><th>名稱</th><th>權限</th><th>建立時間</th><th>操作</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="error" id="err" role="alert" style="margin-top:12px"></p>
</section>

<script src="../ui.js"></script>
<script src="admin.js"></script>
<script>
if (requireAdminLogin()) {
  let meId = null;
  let admins = [];
  const ROLE_LABEL = { admin: '主辦（管理員）', banker: '銀行關主' };
  // onclick 只傳 id，email 從這份清單裡查。把 email 直接內嵌進 onclick 的字串
  // 參數裡，只要值裡有個單引號整個 handler 就變成語法錯誤（esc() escape 成
  // &#39; 也救不了——HTML 屬性會先解碼回單引號才交給 JS 解析）。
  const emailOf = id => (admins.find(a => a.id === id) || {}).email || '';

  $('addForm').addEventListener('submit', async () => {
    $('addErr').textContent = '';
    const { ok, body } = await api('/admins', {
      method: 'POST',
      body: JSON.stringify({
        email: $('newEmail').value,
        password: $('newPassword').value,
        displayName: $('newName').value,
        role: $('newRole').value
      })
    });
    if (!ok) { $('addErr').textContent = body.error || '新增失敗'; return; }
    $('newEmail').value = ''; $('newPassword').value = ''; $('newName').value = '';
    await load();
  });

  window.resetPassword = async function (id) {
    const pw = prompt(`「${emailOf(id)}」的新密碼（至少 8 字元）`);
    if (pw === null) return;
    $('err').textContent = '';
    const { ok, body } = await api(`/admins/${id}/password`, {
      method: 'PATCH', body: JSON.stringify({ password: pw })
    });
    if (!ok) { $('err').textContent = body.error || '重設失敗'; return; }
    $('err').textContent = '';
    alert('密碼已更新');
  };

  window.removeAdmin = async function (id) {
    if (!confirm(`確定要刪除「${emailOf(id)}」這個帳號嗎？此動作無法復原。\n（他做過的稽核紀錄會保留。）`)) return;
    $('err').textContent = '';
    const res = await api(`/admins/${id}`, { method: 'DELETE' });
    if (!res.ok && res.status !== 204) {
      $('err').textContent = res.body.error || `刪除失敗 (${res.status})`;
      return;
    }
    await load();
  };

  async function load() {
    const me = await api('/me');
    if (me.ok) meId = me.body.id;

    const { ok, body } = await api('/admins');
    admins = ok ? body : [];
    if (!ok) {
      $('rows').innerHTML = '<tr><td colspan="5" class="muted">你不是管理員，看不到帳號清單。</td></tr>';
      return;
    }
    $('rows').innerHTML = body.map(a => `
      <tr class="${a.id === meId ? 'me' : ''}">
        <td>${esc(a.email)}${a.id === meId ? '<span class="you">你</span>' : ''}</td>
        <td>${esc(a.display_name || '—')}</td>
        <td><span class="badge ${a.role === 'admin' ? 'approved' : 'neutral'}">${ROLE_LABEL[a.role] || a.role}</span></td>
        <td class="muted" style="white-space:nowrap">${new Date(a.created_at).toLocaleString()}</td>
        <td><div class="actions">
          <button class="sm ghost" type="button" onclick="resetPassword(${a.id})">重設密碼</button>
          ${a.id === meId ? '' : `<button class="sm danger" type="button" onclick="removeAdmin(${a.id})">刪除</button>`}
        </div></td>
      </tr>`).join('');
  }

  load();
}
</script>
</body></html>
