<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>股價控管 - 賭大股票系統</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="wide">
<a class="back" href="index.html"><i data-icon="back"></i>回後台</a>
<h1>股價控管</h1>

<section class="card">
  <h2 id="priceFormTitle"><i data-icon="chart"></i>設定一波的股價</h2>
  <div class="inline" style="margin-bottom:12px">
    <div style="flex:0 0 120px"><label for="wave">波次</label><input id="wave" type="number" min="1" inputmode="numeric"></div>
  </div>
  <p class="hint" id="priceFormHelp">每一波結束後才設定下一筆價格。每檔可以「直接填新價格」或「填漲跌百分比」（以前一波價格為基準換算），兩欄擇一填即可；都留空表示這檔不改。</p>
  <div class="table-wrap">
    <table>
      <thead><tr><th>股票</th><th class="n" id="basePriceHeading">前一波價格</th><th id="priceInputHeading">新價格</th><th id="changeHeading">漲跌 %</th></tr></thead>
      <tbody id="form"></tbody>
    </table>
  </div>
  <p class="error" id="err" role="alert" style="margin-top:12px"></p>
  <button id="btn" type="button" style="max-width:240px;margin-top:12px">套用</button>
</section>

<section class="card">
  <h2><i data-icon="list"></i>歷史股價</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>波</th><th>股票</th><th class="n">比較基準</th><th class="n">價格</th><th class="n">漲跌</th></tr></thead>
      <tbody id="hist"></tbody>
    </table>
  </div>
</section>

<script src="../ui.js"></script>
<script src="admin.js"></script>
<script>
if (requireAdminLogin()) {
  let stocks = [];

  $('btn').addEventListener('click', async () => {
    $('err').textContent = '';
    const prices = stocks.map(s => ({
      stockId: s.id,
      price: $('p-' + s.id).value,
      changePct: $('c-' + s.id).value
    }));
    $('btn').disabled = true;
    try {
      const { ok, body } = await api('/prices/' + Number($('wave').value), {
        method: 'PUT',
        body: JSON.stringify({ prices })
      });
      if (!ok) { $('err').textContent = body.error || '套用失敗'; return; }
      stocks.forEach(s => { $('p-' + s.id).value = ''; $('c-' + s.id).value = ''; });
      await load();
    } finally {
      $('btn').disabled = false;
    }
  });

  async function load() {
    const st = await api('/state');
    if (st.ok && !$('wave').value) $('wave').value = st.body.wave;

    const m = await fetch('/api/market/stocks').then(r => r.json());
    stocks = m.stocks;

    const hist = await api('/prices');
    const rows = hist.ok ? hist.body : [];
    // 目標波次的前一波價格，讓主辦知道換算基準是多少
    const target = Number($('wave').value);
    const prevOf = {};
    if (target === 1) {
      // 第一波沒有「前一波」；初始設定的開盤價就是這一波的原價格。
      rows.filter(r => r.wave === 1).forEach(r => { prevOf[r.stockId] = r.price; });
      $('basePriceHeading').textContent = '原價格';
      $('priceInputHeading').textContent = '設定原價格';
      $('changeHeading').textContent = '漲跌 %（不適用）';
      $('priceFormTitle').innerHTML = '<i data-icon="chart"></i>第一波開始前：設定原價格';
      $('priceFormHelp').textContent = '請直接輸入四間公司的原價格。第一波沒有前一波可比較，因此不需要填漲跌百分比。';
    } else {
      rows.filter(r => r.wave < target).forEach(r => { prevOf[r.stockId] = r.price; });
      $('basePriceHeading').textContent = '前一波價格';
      $('priceInputHeading').textContent = '新價格';
      $('changeHeading').textContent = '漲跌 %';
      $('priceFormTitle').innerHTML = '<i data-icon="chart"></i>設定一波的股價';
      $('priceFormHelp').textContent = '每一波結束後才設定下一筆價格。每檔可以「直接填新價格」或「填漲跌百分比」（以前一波價格為基準換算），兩欄擇一填即可；都留空表示這檔不改。';
    }

    // 每個輸入框都要有對得上的名稱：一列兩格沒有 <label>，螢幕報讀器只會唸「編輯文字」
    $('form').innerHTML = stocks.map(s => `
      <tr><td><strong>${esc(s.name)}</strong></td>
      <td class="n muted">${prevOf[s.id] === undefined ? '—' : money(prevOf[s.id])}</td>
      <td><input id="p-${s.id}" type="number" step="0.01" min="0.01" inputmode="decimal" aria-label="${esc(s.name)} ${target === 1 ? '原價格' : '新價格'}"></td>
      <td><input id="c-${s.id}" type="number" step="0.01" inputmode="decimal" aria-label="${esc(s.name)} 漲跌百分比" ${target === 1 ? 'disabled' : ''}></td></tr>`).join('');
    hydrateIcons($('priceFormTitle'));

    $('hist').innerHTML = rows.slice().reverse().map(r => `
      <tr><td class="rank">${r.wave}</td><td>${esc(r.name)}</td><td class="n muted">${r.previousPrice === null ? '原價格' : money(r.previousPrice)}</td><td class="n">${money(r.price)}</td>
      <td class="n">${chgHtml(r.changePct)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">尚無資料</td></tr>';
  }

  $('wave').addEventListener('change', load);
  load();
}
</script>
</body></html>
