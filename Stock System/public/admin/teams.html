<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>隊伍與結算總覽 - 賭大股票系統</title></head>
<body>
<h1>隊伍與結算總覽</h1>
<p><a href="index.html">&laquo; 回後台</a></p>

<div class="admin-only" style="display:none">
  <h2>新增隊伍</h2>
  <p>
    隊伍名稱 <input id="newName">
    PIN <input id="newPin" maxlength="4" style="width:5em">
    <button id="addBtn">新增</button>
  </p>
  <p id="addErr" style="color:#c00"></p>
</div>

<h2>總資產排行榜與持股總覽</h2>
<p>四檔的欄位顯示「持有張數（市值）」，張數是目前庫存，市值用第 <strong id="lbWave">—</strong> 波的股價計算。
   <label style="margin-left:12px"><input type="checkbox" id="showValue" checked> 顯示市值</label></p>
<div style="overflow-x:auto">
  <table border="1" cellpadding="4">
    <thead><tr id="lbHead"></tr></thead>
    <tbody id="lb"></tbody>
  </table>
</div>

<h2>隊伍帳號</h2>
<table border="1" cellpadding="4">
  <thead><tr><th>隊伍</th><th>PIN</th><th>可用現金</th>
    <th class="admin-only" style="display:none">覆寫餘額</th>
    <th class="admin-only" style="display:none">重設 PIN</th>
    <th class="admin-only" style="display:none">刪除</th></tr></thead>
  <tbody id="teams"></tbody>
</table>
<p id="cashErr" style="color:#c00"></p>

<h2>最近成交</h2>
<table border="1" cellpadding="4">
  <thead><tr><th>時間</th><th>波</th><th>隊伍</th><th>股票</th><th>買賣</th><th>張數</th><th>價格</th><th>總額</th></tr></thead>
  <tbody id="trades"></tbody>
</table>

<script src="admin.js"></script>
<script>
if (requireAdminLogin()) {
  let isAdmin = false;
  let teams = [];
  let lastBoard = null;   // 最近一次的排行榜資料，切換「顯示市值」時重畫用
  const nameOf = id => (teams.find(t => t.id === id) || {}).display_name || '';

  $('addBtn').addEventListener('click', async () => {
    $('addErr').textContent = '';
    const { ok, body } = await api('/teams', {
      method: 'POST',
      body: JSON.stringify({ displayName: $('newName').value, pin: $('newPin').value })
    });
    if (!ok) { $('addErr').textContent = body.error || '新增失敗'; return; }
    $('newName').value = ''; $('newPin').value = '';
    await load();
  });

  window.overrideCash = async function (id) {
    const v = prompt('新的可用現金餘額');
    if (v === null) return;
    $('cashErr').textContent = '';
    const { ok, body } = await api(`/teams/${id}/cash`, {
      method: 'PATCH', body: JSON.stringify({ cash: Number(v) })
    });
    if (!ok) { $('cashErr').textContent = body.error || '覆寫失敗'; return; }
    await load();
  };

  // 現場一定會有隊伍把 PIN 忘掉。沒有這顆按鈕就只能去翻資料庫。
  window.resetPin = async function (id) {
    const pin = prompt(`「${nameOf(id)}」的新 PIN（4 碼數字）`);
    if (pin === null) return;
    $('cashErr').textContent = '';
    const { ok, body } = await api(`/teams/${id}/pin`, {
      method: 'PATCH', body: JSON.stringify({ pin: pin.trim() })
    });
    if (!ok) { $('cashErr').textContent = body.error || '重設失敗'; return; }
    await load();
  };

  // 刪除分兩段：沒有交易/申報紀錄的直接刪；有紀錄的後端會回 409 + needsForce，
  // 講清楚會連帶刪掉什麼再問一次，確認了才帶 force=1 重送。
  window.removeTeam = async function (id, force) {
    const name = nameOf(id);
    if (!force && !confirm(`確定要刪除「${name}」這支隊伍嗎？此動作無法復原。`)) return;
    $('cashErr').textContent = '';

    const res = await api(`/teams/${id}${force ? '?force=1' : ''}`, { method: 'DELETE' });
    if (res.status === 204) { await load(); return; }

    if (res.status === 409 && res.body.needsForce) {
      const r = res.body.records || {};
      const ok = confirm(
        `「${name}」已經有 ${r.trades} 筆成交、${r.deposits} 筆存款申報。\n` +
        '連同這些紀錄一起刪除的話，排行榜與帳目都會跟著變動。\n\n確定要刪嗎？'
      );
      if (!ok) return;
      return removeTeam(id, true);
    }
    $('cashErr').textContent = res.body.error || `刪除失敗 (${res.status})`;
  };

  // 排行榜 ＋ 每隊四檔持股的矩陣。
  //
  // 欄位由伺服器回的 stocks 決定而不是寫死四欄：股票是資料庫裡的資料，之後要
  // 加減一檔或改名都不用動這一頁。每一列的 positions 也保證涵蓋全部股票（沒
  // 持股的是 0），所以直接照順序輸出就一定對齊。
  function renderBoard(body) {
    const stocks = body.stocks || [];
    $('lbWave').textContent = body.wave;

    $('lbHead').innerHTML =
      '<th>名次</th><th>隊伍</th>' +
      stocks.map(s => `<th>${esc(s.name)}<br><span style="font-weight:normal">${
        s.price === null ? '尚未開盤' : money(s.price)}</span></th>`).join('') +
      '<th>現金</th><th>股票現值</th><th>總資產</th>';

    const withValue = $('showValue').checked;
    const cols = stocks.length + 5;

    $('lb').innerHTML = body.teams.map(t => {
      const cells = stocks.map(s => {
        // positions 是照 stocks 的順序來的，但還是用 stockId 對，不靠順序巧合
        const p = (t.positions || []).find(x => x.stockId === s.id);
        const shares = p ? p.shares : 0;
        // 沒持股的格子用淡灰的 0，不留白——空白格會讓人分不清「沒有」和「還沒載入」
        if (!shares) return '<td style="color:#bbb">0</td>';
        return `<td><strong>${shares}</strong> 張${
          withValue ? `<br><span style="color:#666">${money(p.value)}</span>` : ''}</td>`;
      }).join('');
      return `<tr>
        <td>${t.rank}</td><td>${esc(t.name)}</td>
        ${cells}
        <td>${money(t.cash)}</td><td>${money(t.stockValue)}</td>
        <td><strong>${money(t.total)}</strong></td>
      </tr>`;
    }).join('') || `<tr><td colspan="${cols}">還沒有隊伍</td></tr>`;
  }

  // 只切換顯示方式，不用重打 API
  $('showValue').addEventListener('change', () => { if (lastBoard) renderBoard(lastBoard); });

  async function load() {
    const lb = await api('/leaderboard');
    if (lb.ok) { lastBoard = lb.body; renderBoard(lb.body); }

    const ts = await api('/teams');
    if (ts.ok) {
      teams = ts.body;
      $('teams').innerHTML = ts.body.map(t => `
        <tr><td>${esc(t.display_name)}</td><td>${esc(t.pin)}</td><td>${money(t.cash)}</td>
        ${isAdmin ? `<td><button onclick="overrideCash(${t.id})">覆寫</button></td>
                     <td><button onclick="resetPin(${t.id})">重設</button></td>
                     <td><button onclick="removeTeam(${t.id})">刪除</button></td>` : ''}</tr>`).join('')
        || '<tr><td colspan="6">還沒有隊伍</td></tr>';
    }

    const tr = await api('/trades');
    if (tr.ok) {
      $('trades').innerHTML = tr.body.map(x => `
        <tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.wave}</td>
        <td>${esc(x.team_name)}</td><td>${esc(x.stock_name)}</td>
        <td>${x.side === 'buy' ? '買進' : '賣出'}</td><td>${x.shares}</td>
        <td>${money(x.price)}</td><td>${money(x.total)}</td></tr>`).join('')
        || '<tr><td colspan="8">尚無成交</td></tr>';
    }
  }

  (async () => {
    const me = await api('/me');
    isAdmin = me.body.adminRole === 'admin';
    document.querySelectorAll('.admin-only').forEach(el => { el.style.display = isAdmin ? '' : 'none'; });
    await load();
    setInterval(load, 5000);
  })();
}
</script>
</body></html>
