<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理後台 - 賭大股票系統</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="wide">
<section class="bankcard">
  <div class="row"><h1 class="brand">賭大股票 · 管理後台</h1><span class="team" id="role">載入中</span></div>
  <div class="lab" style="margin-top:14px">目前進度</div>
  <div class="total" style="font-size:30px">第 <span id="curWave">—</span> / <span id="totalWaves">—</span> 波</div>
  <div class="lab" id="curPhase" style="font-size:16px;color:#fff;margin-top:2px"></div>
</section>
<p class="notice" id="bankerNote" hidden>你是銀行關主：只能審核存款申報，其餘功能會被伺服器擋下。</p>

<section class="card admin-only" hidden>
  <h2><i data-icon="flag"></i>遊戲進程</h2>
  <!-- 五個階段排成一條進度：現在走到哪裡、下一步是什麼，一眼看得出來 -->
  <ol class="steps" id="phaseSteps" style="grid-template-columns:repeat(5,1fr);margin-bottom:14px" aria-label="本波階段"></ol>
  <div class="inline">
    <div style="flex:0 0 110px"><label for="waveInput">波次</label><input id="waveInput" type="number" min="1" inputmode="numeric"></div>
    <div style="flex:1 1 220px"><label for="phaseSel">階段</label>
      <select id="phaseSel">
        <option value="news">階段一 · 新聞發布</option>
        <option value="gambling">階段二 · 賭博賺錢</option>
        <option value="deposit">階段三 · 資產申報與審核</option>
        <option value="trading">階段四 · 股票交易</option>
        <option value="closed">已收盤</option>
      </select></div>
    <button id="stateBtn" type="button">套用</button>
  </div>
  <p class="hint" style="margin-top:10px">不強制照順序推進——新聞打錯字要倒回階段一重發，是現場常有的事。</p>
  <p class="error" id="stateErr" role="alert"></p>
</section>

<h2 style="margin-top:6px">功能</h2>
<nav class="tiles wide" aria-label="功能">
  <a class="tile" href="bank.html"><i data-icon="bank"></i><span>實體銀行對帳<small>核准或駁回各隊的存款申報</small></span></a>
  <a class="tile" href="teams.html"><i data-icon="users"></i><span>隊伍與結算總覽<small>排行、持股、帳號、成交明細</small></span></a>
  <a class="tile admin-only" href="news.html" hidden><i data-icon="news"></i><span>新聞發布<small>每一波的事件新聞</small></span></a>
  <a class="tile admin-only" href="prices.html" hidden><i data-icon="chart"></i><span>股價控管<small>設定每一波的收盤價</small></span></a>
  <a class="tile admin-only" href="admins.html" hidden><i data-icon="key"></i><span>管理端帳號<small>主辦與銀行關主帳號</small></span></a>
  <a class="tile" href="../leaderboard.html" target="_blank" rel="noopener"><i data-icon="screen"></i><span>排行榜（投影用）↗<small>在大螢幕上開這一頁</small></span></a>
</nav>

<button id="logoutBtn" class="ghost" type="button" style="max-width:280px;margin:18px auto 0"><i data-icon="logout" data-size="sm"></i>登出</button>

<script src="../ui.js"></script>
<script src="admin.js"></script>
<script>
if (requireAdminLogin()) {
  $('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('stockAdminToken');
    location.href = 'login.html';
  });

  $('stateBtn').addEventListener('click', async () => {
    $('stateErr').textContent = '';
    $('stateBtn').disabled = true;
    try {
      const { ok, body } = await api('/state', {
        method: 'PATCH',
        body: JSON.stringify({ wave: Number($('waveInput').value), phase: $('phaseSel').value })
      });
      if (!ok) { $('stateErr').textContent = body.error || '失敗'; return; }
      render(body);
    } finally {
      $('stateBtn').disabled = false;
    }
  });

  const PHASES = [['news', '新聞'], ['gambling', '賭博'], ['deposit', '申報審核'], ['trading', '交易'], ['closed', '收盤']];
  function render(s) {
    $('curWave').textContent = s.wave;
    $('totalWaves').textContent = s.total_waves;
    $('curPhase').textContent = PHASE_LABEL[s.phase] || s.phase;
    $('waveInput').value = s.wave;
    $('waveInput').max = s.total_waves;
    $('phaseSel').value = s.phase;
    const cur = PHASES.findIndex(p => p[0] === s.phase);
    $('phaseSteps').innerHTML = PHASES.map(([, label], i) => {
      const cls = i < cur ? 'done' : i === cur ? 'now' : '';
      const mark = i < cur ? icon('check', 'ic-sm') : String(i + 1);
      return `<li class="${cls}"${i === cur ? ' aria-current="step"' : ''}><span class="dot">${mark}</span>${label}</li>`;
    }).join('');
  }

  (async () => {
    const me = await api('/me');
    const isAdmin = me.body.adminRole === 'admin';
    $('role').textContent = isAdmin ? '主辦（管理員）' : '銀行關主';
    $('bankerNote').hidden = isAdmin;
    document.querySelectorAll('.admin-only').forEach(el => { el.hidden = !isAdmin; });

    const s = await api('/state');
    if (s.ok) render(s.body);
  })();
}
</script>
</body></html>
