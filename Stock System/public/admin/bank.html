<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>實體銀行對帳 - 賭大股票系統</title></head>
<body>
<h1>實體銀行對帳</h1>
<p><a href="index.html">&laquo; 回後台</a>　第 <strong id="wave"></strong> 波</p>
<p>隊伍攜帶實體籌碼到攤位數鈔核對。金額相符按「核准入帳」，不符按「駁回作廢」——駁回的隊伍本波不能買賣股票。</p>
<table border="1" cellpadding="4">
  <thead><tr><th>隊伍</th><th>提報金額</th><th>目前餘額</th><th>狀態</th><th>操作</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>
<p id="err" style="color:#c00"></p>
<script src="admin.js"></script>
<script>
if (requireAdminLogin()) {
  async function load() {
    const { ok, body } = await api('/deposits');
    if (!ok) return;
    $('wave').textContent = body.wave;
    $('tbody').innerHTML = body.deposits.map(d => `
      <tr>
        <td>${esc(d.display_name)}</td>
        <td><strong>${money(d.amount)}</strong></td>
        <td>${money(d.cash)}</td>
        <td>${DEPOSIT_LABEL[d.status]}</td>
        <td>${d.status === 'pending'
          ? `<button onclick="review(${d.id},'approve')">核准入帳</button>
             <button onclick="review(${d.id},'reject')">駁回作廢</button>` : ''}</td>
      </tr>`).join('') || '<tr><td colspan="5">本波還沒有隊伍提報</td></tr>';
  }

  window.review = async function (id, action) {
    const label = action === 'approve' ? '核准入帳' : '駁回作廢（該隊本波不能交易）';
    if (!confirm(`確定要${label}嗎？`)) return;
    $('err').textContent = '';
    const { ok, body } = await api(`/deposits/${id}/${action}`, { method: 'POST' });
    if (!ok) { $('err').textContent = body.error || '操作失敗'; return; }
    await load();
  };

  load();
  // 隊伍是陸續來攤位的，固定週期把新提報拉進來
  setInterval(load, 4000);
}
</script>
</body></html>
