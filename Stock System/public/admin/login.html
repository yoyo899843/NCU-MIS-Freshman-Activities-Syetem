<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理後台登入 - 賭大股票系統</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<section class="bankcard" style="margin-top:12px">
  <div class="row"><p class="brand">賭大股票 · 後台</p><i data-icon="key"></i></div>
  <h1 style="font-size:24px;font-weight:800;margin:14px 0 0">工作人員登入</h1>
  <div class="lab" style="margin-top:4px">主辦與銀行關主使用。玩家請到隊伍登入頁。</div>
</section>

<form class="card" id="form" onsubmit="return false">
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" autocapitalize="off">
  <label for="password">密碼</label>
  <input id="password" type="password" autocomplete="current-password">
  <p class="error" id="err" role="alert"></p>
  <button id="btn" type="submit">登入</button>
</form>
<p class="foot"><a href="../login.html">隊伍登入</a></p>

<script src="../ui.js"></script>
<script src="admin.js"></script>
<script>
if (adminToken()) location.href = 'index.html';
$('form').addEventListener('submit', async () => {
  $('err').textContent = '';
  $('btn').disabled = true;
  try {
    const { ok, body } = await api('/login', {
      method: 'POST',
      body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value })
    });
    if (!ok) { $('err').textContent = body.error || '登入失敗'; return; }
    localStorage.setItem('stockAdminToken', body.token);
    location.href = 'index.html';
  } finally {
    $('btn').disabled = false;
  }
});
</script>
</body></html>
