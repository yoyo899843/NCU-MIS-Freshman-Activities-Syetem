<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新聞發布 - 賭大股票系統</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="wide">
<a class="back" href="index.html"><i data-icon="back"></i>回後台</a>
<h1>新聞發布</h1>

<form class="card" id="form" onsubmit="return false">
  <h2><i data-icon="news"></i>發布一則新聞</h2>
  <div class="field-row" style="grid-template-columns:110px 1fr">
    <div><label for="wave">波次</label><input id="wave" type="number" min="1" inputmode="numeric"></div>
    <div><label for="title">標題</label><input id="title" maxlength="120"></div>
  </div>
  <label for="body">內文（選填）</label>
  <textarea id="body" rows="4"></textarea>
  <p class="helper">發布後玩家的「新聞情報中心」和首頁會在 5 秒內出現。</p>
  <p class="error" id="err" role="alert"></p>
  <button id="btn" type="submit" style="max-width:240px">發布</button>
</form>

<section class="card">
  <h2><i data-icon="list"></i>已發布</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>波</th><th>標題與內文</th><th>時間</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</section>

<script src="../ui.js"></script>
<script src="admin.js"></script>
<script>
if (requireAdminLogin()) {
  $('form').addEventListener('submit', async () => {
    $('err').textContent = '';
    $('btn').disabled = true;
    try {
      const { ok, body } = await api('/news', {
        method: 'POST',
        body: JSON.stringify({ wave: Number($('wave').value), title: $('title').value, body: $('body').value })
      });
      if (!ok) { $('err').textContent = body.error || '發布失敗'; return; }
      $('title').value = ''; $('body').value = '';
      await load();
    } finally {
      $('btn').disabled = false;
    }
  });

  window.del = async function (id) {
    if (!confirm('確定要刪除這則新聞嗎？玩家端會立刻看不到。')) return;
    await api('/news/' + id, { method: 'DELETE' });
    await load();
  };

  async function load() {
    const st = await api('/state');
    if (st.ok && !$('wave').value) $('wave').value = st.body.wave;
    const { ok, body } = await api('/news');
    if (!ok) return;
    $('tbody').innerHTML = body.map(n => `
      <tr><td class="rank">${n.wave}</td>
      <td><strong>${esc(n.title)}</strong>${n.body ? `<div class="hint" style="white-space:pre-wrap">${esc(n.body)}</div>` : ''}</td>
      <td class="muted" style="white-space:nowrap">${new Date(n.published_at).toLocaleString()}</td>
      <td><button class="sm danger" type="button" onclick="del(${n.id})">刪除</button></td></tr>`).join('')
      || '<tr><td colspan="4" class="muted">尚未發布任何新聞</td></tr>';
  }
  load();
}
</script>
</body></html>
