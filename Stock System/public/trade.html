<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交易與帳戶 - 賭大股票系統</title></head>
<body>
<h1>交易與帳戶中心</h1>
<p><a href="index.html">&laquo; 回首頁</a>　目前第 <strong id="wave"></strong> 波　<strong id="phase"></strong></p>

<h2>存款提報</h2>
<div id="depositBox">
  <p id="depositState">—</p>
  <p id="depositForm" style="display:none">
    實體換算金額 <input id="amount" type="number" min="0" step="1">
    <button id="depositBtn">送出申報</button>
  </p>
  <p id="depositErr" style="color:#c00"></p>
</div>

<h2>下單交易</h2>
<p id="tradeLock" style="color:#c00"></p>
<div id="tradeForm" style="display:none">
  <p>
    <select id="stockSel"></select>
    <select id="sideSel"><option value="buy">買進</option><option value="sell">賣出</option></select>
    <input id="shares" type="number" min="1" step="1" placeholder="張數">
    <button id="orderBtn">送出</button>
  </p>
  <p id="orderHint"></p>
  <p id="orderErr" style="color:#c00"></p>
</div>

<h2>資產總覽</h2>
<p>可用現金：<strong id="cash">—</strong>　股票現值：<strong id="stockValue">—</strong>　總資產：<strong id="total">—</strong></p>
<table border="1" cellpadding="4">
  <thead><tr><th>股票</th><th>股價</th><th>漲跌</th><th>持有張數</th><th>市值</th></tr></thead>
  <tbody id="positions"></tbody>
</table>

<h2>成交紀錄</h2>
<table border="1" cellpadding="4">
  <thead><tr><th>時間</th><th>波</th><th>股票</th><th>買賣</th><th>張數</th><th>成交價</th><th>總額</th></tr></thead>
  <tbody id="trades"></tbody>
</table>

<script src="app.js"></script>
<script>
if (requireLogin()) {
  let positions = [];
  let cash = 0;

  /* ----- 存款提報 ----- */
  $('depositBtn').addEventListener('click', async () => {
    $('depositErr').textContent = '';
    const { ok, body } = await api('/api/team/deposit', {
      method: 'POST',
      body: JSON.stringify({ amount: Number($('amount').value) })
    });
    if (!ok) { $('depositErr').textContent = body.error || '送出失敗'; return; }
    $('amount').value = '';
    await load();
  });

  /* ----- 下單 ----- */
  // 送出前先在前端擋一次餘額/庫存，只是為了少一次來回；真正說了算的是伺服器
  // （src/portfolio.js 的 placeOrder 在交易裡鎖住餘額再判斷）。
  function updateHint() {
    const stock = positions.find(p => p.stockId === Number($('stockSel').value));
    const n = Number($('shares').value);
    if (!stock || !n || !stock.price) { $('orderHint').textContent = ''; return; }
    const totalCost = stock.price * n;
    $('orderHint').textContent = $('sideSel').value === 'buy'
      ? `預估成交金額 ${money(totalCost)}（可用現金 ${money(cash)}）`
      : `預估入帳金額 ${money(totalCost)}（持有 ${stock.shares} 張）`;
  }
  ['stockSel', 'sideSel', 'shares'].forEach(id => $(id).addEventListener('input', updateHint));

  $('orderBtn').addEventListener('click', async () => {
    $('orderErr').textContent = '';
    const { ok, body } = await api('/api/team/orders', {
      method: 'POST',
      body: JSON.stringify({
        stockId: Number($('stockSel').value),
        side: $('sideSel').value,
        shares: Number($('shares').value)
      })
    });
    if (!ok) { $('orderErr').textContent = body.error || '下單失敗'; return; }
    $('shares').value = '';
    await load();
  });

  async function load() {
    const p = await api('/api/team/portfolio');
    if (!p.ok) return;
    positions = p.body.positions;
    cash = p.body.cash;

    $('wave').textContent = p.body.wave;
    $('phase').textContent = PHASE_LABEL[p.body.phase] || p.body.phase;
    $('cash').textContent = money(p.body.cash);
    $('stockValue').textContent = money(p.body.stockValue);
    $('total').textContent = money(p.body.total);
    $('positions').innerHTML = positions.map(x => `
      <tr><td>${esc(x.name)}</td><td>${x.price === null ? '—' : money(x.price)}</td>
      <td>${pctText(x.changePct)}</td><td>${x.shares}</td><td>${money(x.value)}</td></tr>`).join('');

    // 下拉選單只在內容真的變了才重建，否則使用者選到一半會被洗掉
    const wanted = positions.map(x => `${x.stockId}:${x.name}`).join('|');
    if ($('stockSel').dataset.sig !== wanted) {
      $('stockSel').dataset.sig = wanted;
      $('stockSel').innerHTML = positions.map(x =>
        `<option value="${x.stockId}">${esc(x.name)}</option>`).join('');
    }

    const d = await api('/api/team/deposit');
    if (d.ok) {
      const dep = d.body.deposit;
      $('depositState').textContent = dep
        ? `已申報 ${money(dep.amount)} 元　狀態：${DEPOSIT_LABEL[dep.status]}`
        : '本波尚未申報';
      // 一波只能申報一次，送出後表單就收起來
      $('depositForm').style.display = (!dep && d.body.phase === 'deposit') ? '' : 'none';

      const canTrade = d.body.phase === 'trading' && dep && dep.status === 'approved';
      $('tradeForm').style.display = canTrade ? '' : 'none';
      $('tradeLock').textContent = canTrade ? '' :
        d.body.phase !== 'trading' ? '現在不是交易階段。'
        : !dep ? '本波尚未申報存款，無法交易。'
        : dep.status === 'pending' ? '存款審核中，通過後才能交易。'
        : '本波申報金額與實際不符遭駁回，這一波無法交易。';
    }
    updateHint();

    const t = await api('/api/team/trades');
    if (t.ok) {
      $('trades').innerHTML = t.body.map(x => `
        <tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.wave}</td>
        <td>${esc(x.stock_name)}</td><td>${x.side === 'buy' ? '買進' : '賣出'}</td>
        <td>${x.shares}</td><td>${money(x.price)}</td><td>${money(x.total)}</td></tr>`).join('')
        || '<tr><td colspan="7">尚無成交紀錄</td></tr>';
    }
  }

  load();
  setInterval(load, 5000);
}
</script>
</body></html>
