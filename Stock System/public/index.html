<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>賭大股票系統</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top">
  <span class="phase" id="phase">載入中</span>
  <span class="clock" id="clock"></span>
</div>

<section class="bankcard" aria-label="資產總覽">
  <div class="row"><h1 class="brand">賭大股票</h1><span class="team" id="who"></span></div>
  <div class="lab" style="margin-top:14px">總資產</div>
  <div class="total" id="total">—</div>
  <div class="split">
    <div><div class="lab">可用現金</div><div class="num" id="cash">—</div></div>
    <div><div class="lab">股票現值</div><div class="num" id="stockValue">—</div></div>
  </div>
</section>

<section class="card">
  <h2><i data-icon="bank"></i>本波存款</h2>
  <div id="depositState"><p class="hint">載入中…</p></div>
</section>

<nav class="tiles" aria-label="功能">
  <a class="tile" href="news.html"><i data-icon="news"></i>新聞</a>
  <a class="tile" href="market.html"><i data-icon="chart"></i>個股</a>
  <a class="tile" href="trade.html"><i data-icon="trade"></i>交易</a>
  <a class="tile" href="leaderboard.html"><i data-icon="trophy"></i>排行</a>
</nav>

<section class="card">
  <h2><i data-icon="chart"></i>行情與持股</h2>
  <div id="positions"><p class="hint">載入中…</p></div>
</section>

<section class="card" id="newsCard" hidden>
  <h2><i data-icon="news"></i>本波新聞</h2>
  <div id="news"></div>
  <a class="btn ghost sm" href="news.html" style="margin-top:12px">瀏覽本波新聞</a>
</section>

<button id="logoutBtn" class="ghost" type="button"><i data-icon="logout" data-size="sm"></i>登出</button>
<p class="foot"><a href="admin/login.html">工作人員登入</a></p>

<script src="ui.js"></script>
<script src="app.js"></script>
<script>
if (requireLogin()) {
  const info = JSON.parse(localStorage.getItem('teamInfo') || 'null');
  if (info) $('who').textContent = info.displayName;

  $('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('teamToken');
    localStorage.removeItem('teamInfo');
    location.href = 'login.html';
  });

  // 持股列：股價、漲跌、各波價格，有持股的另外寫張數與市值
  function positionRow(p) {
    const hist = p.shares ? `持有 ${p.shares} 張 · 市值 ${money(p.value)}` : '未持有';
    return `<div class="stock">
      <span class="logo" aria-hidden="true">${esc(Array.from(p.name)[0])}</span>
      <div class="info"><div class="nm">${esc(p.name)}</div><div class="sub">${hist}</div></div>
      <div class="right"><div class="px">${p.price === null ? '—' : money(p.price)}</div><div class="sub">${p.previousPrice === null ? '首次價格' : `前一波 ${money(p.previousPrice)}`}</div>${chgHtml(p.changePct)}</div>
    </div>`;
  }

  async function load() {
    const { ok, body } = await api('/api/team/portfolio');
    if (!ok) return;
    const tradingNow = body.phase === 'trading';
    $('phase').className = 'phase' + (tradingNow ? '' : ' idle');
    $('phase').textContent = `第 ${body.wave} 波 · ${PHASE_LABEL[body.phase] || body.phase}`;
    $('cash').textContent = money(body.cash);
    $('stockValue').textContent = money(body.stockValue);
    $('total').textContent = money(body.total);
    $('positions').innerHTML = body.positions.map(positionRow).join('')
      || '<p class="hint">還沒有股票資料。</p>';

    const d = await api('/api/team/deposit');
    if (d.ok) $('depositState').innerHTML = depositSteps(d.body.phase, d.body.deposit);

    const n = await api('/api/market/news');
    if (n.ok && n.body.length) {
      const top = n.body[0];
      $('newsCard').hidden = false;
      $('news').innerHTML = `<div class="news-item"><span class="kick">第 ${top.wave} 波</span>
        <h3>${esc(top.title)}</h3>${top.body ? `<p>${esc(top.body)}</p>` : ''}</div>`;
    } else {
      $('newsCard').hidden = true;
    }
    $('clock').textContent = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  }

  load();
  // 股價與審核結果都是主辦在後台改的，玩家端沒有別的方式知道，固定週期問一次
  setInterval(load, 5000);
}
</script>
</body></html>
