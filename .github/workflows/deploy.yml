name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy

env:
  DEPLOY_DIR: /home/yoyo/NCU-MIS-Freshman-Activities-Syetem

jobs:
  deploy:
    runs-on: [self-hosted, homelab]
    steps:
      - name: Pull
        run: |
          cd "$DEPLOY_DIR"
          git pull --ff-only

      # 根目錄沒有 compose.yml，四個系統各自一個 compose 專案，要分開起。
      # PgAdmin 放最後：它的 compose 以 external:true 引用 timewarfare-internal
      # 和 rpg-internal，這兩個網路是前面兩個系統建立的。
      - name: Compose up
        run: |
          cd "$DEPLOY_DIR"
          for d in "Time-Space Warfare" "RPG System" Portal PgAdmin; do
            (cd "$d" && docker compose up -d --build --remove-orphans)
          done

      # 已套用過的會自己跳過，重複執行是安全的。-T 是因為 CI 沒有 TTY。
      - name: Migrate
        run: |
          cd "$DEPLOY_DIR"
          for d in "Time-Space Warfare" "RPG System"; do
            (cd "$d" && docker compose exec -T app node migrations/migrate.js)
          done
