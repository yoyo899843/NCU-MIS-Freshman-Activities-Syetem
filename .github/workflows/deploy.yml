name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy

env:
  DEPLOY_DIR: /home/yoyo/NCU-MIS-Freshman-Activities-Syetem

jobs:
  deploy:
    runs-on: [self-hosted, ncu-web server]
    steps:
      - name: Pull
        run: |
          cd "$DEPLOY_DIR"
          git pull --ff-only

      # 根目錄沒有 compose.yml，每個系統各自一個 compose 專案，要分開起。
      #
      # 順序有意義：PgAdmin 一定要放最後。它的 compose 以 external:true 引用
      # timewarfare-internal / rpg-internal / stock-internal，這三個網路是前面
      # 那三個系統的 compose 建立的，不先起就會找不到網路而失敗。
      - name: Compose up
        run: |
          cd "$DEPLOY_DIR"
          for d in "Time-Space Warfare" "RPG System" "Stock System" Portal Mods PgAdmin; do
            (cd "$d" && docker compose up -d --build --remove-orphans)
          done

      # Migration 已經移進容器啟動流程（見各系統的 Dockerfile：先跑 migrate、
      # 成功才起 app），所以這裡不再單獨執行——那樣做會有一段「新程式已在服務、
      # schema 還沒更新」的空窗。
      #
      # 改成確認每個 app 真的活著。migration 失敗的話容器會起不來，這一步就會
      # 讓整個 deploy 紅掉；沒有這一步的話失敗會完全無聲。
      - name: Verify apps are healthy
        run: |
          cd "$DEPLOY_DIR"
          for d in "Time-Space Warfare" "RPG System" "Stock System"; do
            (
              cd "$d"
              for i in $(seq 1 30); do
                if docker compose exec -T app node -e \
                     "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))" 2>/dev/null; then
                  echo "$d: healthy"
                  exit 0
                fi
                sleep 2
              done
              echo "$d: 啟動失敗，最後 50 行 log："
              docker compose logs --tail=50 app
              exit 1
            )
          done
